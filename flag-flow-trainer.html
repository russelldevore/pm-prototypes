<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flag Flow — 5v5 Playbook Trainer</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1c3d31">
<style>
  /* No external font imports — keeps this fully self-contained so it caches
     for offline use. Chalk-style headers use a cursive system-font stack
     instead of a webfont. */

  :root{
    --board:#1c3d31;
    --board-dark:#153029;
    --chalk:#f2ede1;
    --chalk-dim:#c9c2ae;
    --off-red:#e2544a;
    --def-blue:#5b9bd1;
    --flag-gold:#e3b23c;
    --line-white:#ffffff55;
    --panel:#0f2620;
    --panel-line:#2f5346;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background: radial-gradient(circle at 30% 10%, #24463a, #0f2620 70%);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    color:var(--chalk);
    padding:24px;
    min-height:100vh;
  }

  .wrap{ max-width:960px; margin:0 auto; }
  @media (min-width: 768px){
    .wrap{ max-width:1180px; }
  }
  @media (min-width: 1100px){
    .wrap{ max-width:1360px; }
  }

  header{ margin-bottom:18px; }
  h1{
    font-family:'Segoe Print','Bradley Hand','Chalkboard SE','Comic Sans MS',cursive;
    font-size:2.1rem;
    letter-spacing:0.5px;
    margin:0 0 4px 0;
    color:var(--chalk);
    text-shadow: 0 0 14px rgba(242,237,225,0.15);
  }
  .subtitle{
    font-family:'Bradley Hand','Segoe Print','Chalkboard SE','Comic Sans MS',cursive;
    color:var(--chalk-dim);
    font-size:1.05rem;
    margin:0;
  }

  .tabs-row{ display:flex; flex-wrap:wrap; gap:10px; margin:16px 0 10px 0; }
  .tab-group{ display:flex; gap:6px; align-items:center; }
  .tab-label{
    font-family:'Bradley Hand','Segoe Print','Chalkboard SE','Comic Sans MS',cursive;
    font-size:0.85rem;
    color:var(--chalk-dim);
    margin-right:4px;
    white-space:nowrap;
  }
  .tab{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    font-weight:600;
    font-size:0.82rem;
    background:var(--panel);
    border:1px solid var(--panel-line);
    color:var(--chalk-dim);
    padding:7px 13px;
    border-radius:20px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .tab:hover{ border-color:var(--flag-gold); color:var(--chalk); }
  .tab.active{
    background:var(--flag-gold);
    color:#2a1d05;
    border-color:var(--flag-gold);
  }

  .board-shell{
    background:var(--board);
    border-radius:14px;
    padding:14px;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.35), 0 10px 30px rgba(0,0,0,0.4);
    border:1px solid #0a1e17;
    position:relative;
  }

  svg{ display:block; width:100%; height:auto; }

  .info-bar{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    margin-top:12px;
    padding:12px 14px;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:10px;
    flex-wrap:wrap;
  }
  .play-desc{ font-size:0.85rem; color:var(--chalk-dim); max-width:520px; line-height:1.45; }
  .play-desc b{ color:var(--chalk); font-family:'Bradley Hand','Segoe Print','Chalkboard SE','Comic Sans MS',cursive; font-size:1rem; }
  .phase-badge{
    font-family:'Bradley Hand','Segoe Print','Chalkboard SE','Comic Sans MS',cursive;
    font-size:0.95rem;
    background:rgba(227,178,60,0.12);
    border:1px solid rgba(227,178,60,0.4);
    color:var(--flag-gold);
    padding:6px 14px;
    border-radius:8px;
    white-space:nowrap;
    height:fit-content;
  }

  .controls{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .btn{
    background:var(--panel);
    border:1px solid var(--panel-line);
    color:var(--chalk);
    width:38px; height:38px;
    border-radius:50%;
    cursor:pointer;
    font-size:1rem;
    display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
  }
  .btn:hover{ border-color:var(--flag-gold); }
  .btn.primary{
    background:var(--flag-gold);
    color:#2a1d05;
    border-color:var(--flag-gold);
    width:44px; height:44px;
    font-size:1.1rem;
  }
  .scrub{
    flex:1;
    min-width:140px;
    accent-color: var(--flag-gold);
  }
  .speed-select{
    background:var(--panel);
    border:1px solid var(--panel-line);
    color:var(--chalk-dim);
    border-radius:8px;
    padding:6px 8px;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    font-size:0.8rem;
  }

  .legend{
    display:flex; gap:18px; margin-top:10px; flex-wrap:wrap;
    font-size:0.78rem; color:var(--chalk-dim);
  }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .swatch{ width:12px; height:12px; border-radius:50%; display:inline-block; }

  .lineup-panel{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    margin-bottom:10px;
  }
  .lineup-chip{
    display:flex; align-items:center; gap:6px;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:20px;
    padding:4px 6px 4px 12px;
  }
  .lineup-chip .role{
    font-family:'Bradley Hand','Segoe Print','Chalkboard SE','Comic Sans MS',cursive;
    font-size:0.85rem;
    color:var(--flag-gold);
    white-space:nowrap;
  }
  .lineup-chip select{
    background:transparent;
    border:none;
    color:var(--chalk);
    font-family:'Inter',-apple-system,sans-serif;
    font-size:0.8rem;
    font-weight:600;
    padding:5px 6px;
    border-radius:14px;
  }
  .lineup-chip select:focus{ outline:1px solid var(--flag-gold); }
  .lineup-chip select option{ background:var(--panel); color:var(--chalk); }
  .lineup-chip select optgroup{ font-weight:700; color:#000; font-style:normal; }

  .builder-panel{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    margin-bottom:10px;
    padding:10px 12px;
    background:rgba(227,178,60,0.06);
    border:1px solid rgba(227,178,60,0.35);
    border-radius:10px;
  }
  .builder-flip{
    background:var(--flag-gold);
    color:#2a1d05;
    border:none;
    border-radius:20px;
    padding:6px 14px;
    font-family:'Inter',-apple-system,sans-serif;
    font-weight:700;
    font-size:0.8rem;
    cursor:pointer;
  }
  .builder-flip:hover{ opacity:0.9; }

  .mode-toggle{
    display:inline-flex;
    gap:4px;
    background:var(--panel);
    border:1px solid var(--panel-line);
    border-radius:22px;
    padding:4px;
    margin-bottom:14px;
  }
  .mode-btn{
    background:transparent;
    border:none;
    color:var(--chalk-dim);
    font-family:'Inter',-apple-system,sans-serif;
    font-weight:700;
    font-size:0.82rem;
    padding:7px 18px;
    border-radius:18px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .mode-btn:hover{ color:var(--chalk); }
  .mode-btn.active{ background:var(--flag-gold); color:#2a1d05; }

  .tap-controls{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    margin-bottom:14px;
  }
  .formation-btn, .subtoggle-btn{
    background:var(--panel);
    border:1px solid var(--panel-line);
    color:var(--chalk-dim);
    font-family:'Inter',-apple-system,sans-serif;
    font-weight:600;
    font-size:0.82rem;
    padding:10px 16px;
    border-radius:20px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .formation-btn:hover, .subtoggle-btn:hover{ border-color:var(--flag-gold); color:var(--chalk); }
  .formation-btn.active, .subtoggle-btn.active{ background:var(--flag-gold); color:#2a1d05; border-color:var(--flag-gold); }
  .tap-hint{
    font-family:'Bradley Hand','Segoe Print','Chalkboard SE','Comic Sans MS',cursive;
    font-size:0.9rem;
    color:var(--chalk-dim);
  }

  /* tappable player affordance, applied to the SVG <g> wrapping a player */
  .tappable{ cursor:pointer; }
  .tappable circle{ transition: stroke-width .12s ease, filter .12s ease; }
  .tappable:hover circle, .tappable:active circle{ filter: drop-shadow(0 0 4px var(--flag-gold)); }

  .assign-sheet-backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.5);
    z-index:1000;
    display:flex; align-items:flex-start; justify-content:center;
    padding-top:5vh;
  }
  .assign-sheet{
    width:100%; max-width:480px;
    background:var(--board-dark);
    border:1px solid var(--panel-line);
    border-radius:16px;
    padding:16px;
    max-height:85vh;
    overflow-y:auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .assign-sheet h3{
    font-family:'Bradley Hand','Segoe Print','Chalkboard SE','Comic Sans MS',cursive;
    color:var(--flag-gold);
    margin:0 0 4px 0;
    font-size:1.2rem;
  }
  .assign-sheet .assign-current{
    color:var(--chalk-dim);
    font-size:0.82rem;
    margin:0 0 14px 0;
  }
  .assign-group-label{
    font-family:'Inter',-apple-system,sans-serif;
    font-weight:700;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--chalk-dim);
    margin:14px 0 8px 0;
  }
  .assign-group-label:first-of-type{ margin-top:0; }
  .assign-options{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:8px;
  }
  .assign-option-btn{
    background:var(--panel);
    border:1px solid var(--panel-line);
    color:var(--chalk);
    font-family:'Inter',-apple-system,sans-serif;
    font-weight:600;
    font-size:0.85rem;
    padding:12px 10px;
    border-radius:10px;
    cursor:pointer;
    text-align:center;
  }
  .assign-option-btn:hover{ border-color:var(--flag-gold); }
  .assign-option-btn.current{ background:var(--flag-gold); color:#2a1d05; border-color:var(--flag-gold); }
  .assign-sheet-close{
    display:block;
    width:100%;
    margin-top:16px;
    background:transparent;
    border:1px solid var(--panel-line);
    color:var(--chalk-dim);
    padding:10px;
    border-radius:10px;
    font-family:'Inter',-apple-system,sans-serif;
    font-weight:600;
    cursor:pointer;
  }

  #playDescDetails{ margin-top:18px; }
  details.collapsible{
    margin-bottom:10px;
    border:1px solid var(--panel-line);
    border-radius:10px;
    background:var(--panel);
    overflow:hidden;
  }
  details.collapsible > summary{
    list-style:none;
    cursor:pointer;
    padding:10px 14px;
    font-family:'Bradley Hand','Segoe Print','Chalkboard SE','Comic Sans MS',cursive;
    font-size:0.95rem;
    color:var(--flag-gold);
    display:flex;
    align-items:center;
    gap:8px;
    user-select:none;
  }
  details.collapsible > summary::-webkit-details-marker{ display:none; }
  details.collapsible > summary::before{
    content:'▸';
    display:inline-block;
    transition:transform .15s ease;
    font-size:0.75rem;
  }
  details.collapsible[open] > summary::before{ transform:rotate(90deg); }
  details.collapsible > summary:hover{ background:rgba(227,178,60,0.08); }
  details.collapsible .lineup-panel,
  details.collapsible .builder-panel{
    margin:0;
    border:none;
    border-top:1px solid var(--panel-line);
    border-radius:0;
    background:transparent;
    padding:10px 14px;
  }

  footer{
    text-align:center;
    color:var(--chalk-dim);
    font-size:0.72rem;
    margin-top:18px;
    opacity:0.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Flag Flow</h1>
    <p class="subtitle">5-on-5 playbook trainer — watch the play unfold, snap to whistle.</p>
  </header>

  <details class="collapsible" id="setupDetails" open>
    <summary>Setup</summary>
    <div style="padding:10px 14px 14px;">
      <div class="mode-toggle">
        <button class="mode-btn active" id="modeOffenseBtn">Offense</button>
        <button class="mode-btn" id="modeDefenseBtn">Defense</button>
      </div>
      <div class="mode-toggle">
        <button class="mode-btn active" id="interactionClassicBtn">Classic</button>
        <button class="mode-btn" id="interactionTapBtn">Tap to Assign</button>
      </div>

      <div class="tap-controls" id="tapControls" style="display:none;"></div>

      <div id="offenseControls">
        <div class="tabs-row" id="offenseTabsRow">
          <div class="tab-group">
            <span class="tab-label">OFFENSE</span>
            <div id="playTabs"></div>
          </div>
        </div>

        <details class="collapsible" id="lineupDetails" open>
          <summary>Lineup</summary>
          <div class="lineup-panel" id="lineupPanel"></div>
        </details>

        <details class="collapsible" id="builderDetails" style="display:none;" open>
          <summary>Pass Builder</summary>
          <div class="builder-panel" id="builderPanel"></div>
        </details>

        <details class="collapsible" id="runBuilderDetails" style="display:none;" open>
          <summary>Run Builder</summary>
          <div class="builder-panel" id="runBuilderPanel"></div>
        </details>
      </div>

      <div id="defenseControls" style="display:none;">
        <div class="tabs-row" id="defenseTabsRow">
          <div class="tab-group">
            <span class="tab-label">DEFENSE</span>
            <div id="defenseTabs"></div>
          </div>
        </div>

        <details class="collapsible" id="defenseLineupDetails" open>
          <summary>Lineup</summary>
          <div class="lineup-panel" id="defenseLineupPanel"></div>
        </details>

        <details class="collapsible" id="defenseBuilderDetails" style="display:none;" open>
          <summary>Defense Builder</summary>
          <div class="builder-panel" id="defenseBuilderPanel"></div>
        </details>
      </div>
    </div>
  </details>

  <div class="board-shell">
    <svg id="field" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <div class="controls">
    <button class="btn" id="resetBtn" title="Reset">⟲</button>
    <button class="btn" id="stepBackBtn" title="Step back">◁</button>
    <button class="btn primary" id="playBtn" title="Play/Pause">▶</button>
    <button class="btn" id="stepFwdBtn" title="Step forward">▷</button>
    <input type="range" class="scrub" id="scrub" min="0" max="1000" value="0">
    <select class="speed-select" id="speedSelect">
      <option value="0.1">Slow</option>
      <option value="0.18" selected>Normal</option>
      <option value="0.3">Fast</option>
    </select>
  </div>

  <details class="collapsible" id="playDescDetails" open>
    <summary>Flag Flow Play description</summary>
    <div style="padding:10px 14px 14px;">
      <div class="info-bar">
        <div class="play-desc" id="playDesc"></div>
        <div class="phase-badge" id="phaseBadge">Pre-snap</div>
      </div>

      <div class="legend">
        <span><i class="swatch" style="background:var(--off-red)"></i> Offense</span>
        <span><i class="swatch" style="background:var(--def-blue)"></i> Defense</span>
        <span><i class="swatch" style="background:var(--flag-gold)"></i> Ball / read</span>
      </div>
    </div>
  </details>

  <footer>Prototype teaching tool — canned plays &amp; coverages, built to expand later.</footer>
</div>

<div id="assignSheetRoot"></div>

<script>
(function(){

  // ---------- geometry helpers ----------
  function getPosAtT(waypoints, t){
    if (t <= waypoints[0].t) return {x:waypoints[0].x, y:waypoints[0].y};
    const last = waypoints[waypoints.length-1];
    if (t >= last.t) return {x:last.x, y:last.y};
    for (let i=0;i<waypoints.length-1;i++){
      const a = waypoints[i], b = waypoints[i+1];
      if (t >= a.t && t <= b.t){
        const span = (b.t - a.t) || 1;
        const local = (t - a.t) / span;
        return { x: a.x + (b.x-a.x)*local, y: a.y + (b.y-a.y)*local };
      }
    }
    return {x:last.x, y:last.y};
  }
  function pathFromWaypoints(waypoints){
    return waypoints.map((w,i)=> i===0 ? `M ${w.x} ${w.y}` : `L ${w.x} ${w.y}`).join(' ');
  }

  // ---------- yard scale ----------
  // LOS_X is the pixel x-position of the line of scrimmage; YARD_PX is
  // pixels per yard (used for both depth and width). Field runs 0–50
  // yards, LOS fixed at the 20. CENTER_Y is the field's midline.
  const LOS_X = 330;
  const YARD_PX = 14;
  const FIELD_LEFT = 50;
  const FIELD_TOP = 50, FIELD_BOTTOM = 450;
  const CENTER_Y = 250;
  const HALF_WIDTH = (FIELD_BOTTOM - FIELD_TOP) / 2; // px from center to sideline

  // Keeps generated route points a safe margin inside the sidelines
  // (accounts for player bubble radius) rather than drawing off the field.
  function clampY(y){ return Math.max(72, Math.min(428, y)); }

  // Left-side receivers move toward center by increasing y; right-side
  // receivers move toward center by decreasing y. Route generators use
  // this so the same route definition works mirrored on either side.
  function dirFor(side){ return side === 'L' ? {toCenter:1, toSideline:-1} : {toCenter:-1, toSideline:1}; }

  // Traces a quarter-circle drift — the receiver curls out and upfield
  // along a rounded arc (like a slice of an "O") instead of a hard elbow,
  // then holds that lane the rest of the way upfield. Right = bottom-left
  // quadrant, Left = top-left quadrant (both relative to a circle centered
  // downfield of the start point) — this puts the lateral drift early in
  // the route and the upfield turn late, matching a real bubble screen.
  // dirSign: +1 = Right (drifts toward larger y), -1 = Left (toward smaller y).
  function bubbleArc(sx, sy, dirSign){
    const R = 7*YARD_PX;
    const cx = sx + R, cy = sy; // circle center is R downfield of the start point
    const arcT = [0, 0.09, 0.18, 0.28, 0.4];
    const wps = arcT.map((tt,i)=>{
      const angle = Math.PI - dirSign*(Math.PI/2)*(i/(arcT.length-1));
      return {t:tt, x: cx + R*Math.cos(angle), y: clampY(cy + R*Math.sin(angle))};
    });
    wps.push({t:1, x: sx+27*YARD_PX, y: clampY(sy + dirSign*R)});
    return wps;
  }

  // ---------- route library (for building custom pass plays) ----------
  // Each route is a function(startX, startY, side) -> waypoint array,
  // in the same {t,x,y} shape the animation engine already expects.
  const ROUTES = {
    streak: { label:'Streak', throwT:0.55, generate(sx,sy){
      return [{t:0,x:sx,y:sy},{t:1,x:sx+27*YARD_PX,y:sy}];
    }},
    slant: { label:'Slant', throwT:0.30, generate(sx,sy,side){
      const d = dirFor(side);
      return [{t:0,x:sx,y:sy},
              {t:0.45,x:sx+7*YARD_PX,  y:clampY(sy+d.toCenter*7*YARD_PX)},
              {t:1,   x:sx+14*YARD_PX, y:clampY(sy+d.toCenter*14*YARD_PX)}];
    }},
    bubbleL: { label:'Bubble (Left)', throwT:0.28, generate(sx,sy){
      return bubbleArc(sx, sy, -1);
    }},
    bubbleR: { label:'Bubble (Right)', throwT:0.28, generate(sx,sy){
      return bubbleArc(sx, sy, 1);
    }},
    flatRight: { label:'Flat (Right)', throwT:0.32, generate(sx,sy){
      return [{t:0,x:sx,y:sy},
              {t:0.45,x:sx+6*YARD_PX,  y:clampY(sy+6*YARD_PX)},
              {t:1,   x:sx+10*YARD_PX, y:clampY(sy+10*YARD_PX)}];
    }},
    flatLeft: { label:'Flat (Left)', throwT:0.32, generate(sx,sy){
      return [{t:0,x:sx,y:sy},
              {t:0.45,x:sx+6*YARD_PX,  y:clampY(sy-6*YARD_PX)},
              {t:1,   x:sx+10*YARD_PX, y:clampY(sy-10*YARD_PX)}];
    }},
    screenR: { label:'Screen (Right)', throwT:0.35, generate(sx,sy){
      const targetY = clampY(FIELD_BOTTOM - 5*YARD_PX);
      return [{t:0,x:sx,y:sy},
              {t:0.25,x:sx+1*YARD_PX,y:targetY},
              {t:0.45,x:sx+1*YARD_PX,y:targetY},
              {t:1,   x:sx+22*YARD_PX,y:targetY}];
    }},
    screenL: { label:'Screen (Left)', throwT:0.35, generate(sx,sy){
      const targetY = clampY(FIELD_TOP + 5*YARD_PX);
      return [{t:0,x:sx,y:sy},
              {t:0.25,x:sx+1*YARD_PX,y:targetY},
              {t:0.45,x:sx+1*YARD_PX,y:targetY},
              {t:1,   x:sx+22*YARD_PX,y:targetY}];
    }},
    out: { label:'Out', throwT:0.58, generate(sx,sy,side){
      const d = dirFor(side);
      return [{t:0,x:sx,y:sy},
              {t:0.55,x:sx+10*YARD_PX,y:sy},
              {t:1,   x:sx+10*YARD_PX,y:clampY(sy+d.toSideline*8*YARD_PX)}]; // x held constant — true 90° cut
    }},
    in: { label:'In', throwT:0.58, generate(sx,sy,side){
      const d = dirFor(side);
      return [{t:0,x:sx,y:sy},
              {t:0.55,x:sx+10*YARD_PX,y:sy},
              {t:1,   x:sx+10*YARD_PX,y:clampY(sy+d.toCenter*8*YARD_PX)}]; // x held constant — true 90° cut
    }},
    post: { label:'Post', throwT:0.62, generate(sx,sy,side){
      const d = dirFor(side);
      return [{t:0,x:sx,y:sy},
              {t:0.5,x:sx+10*YARD_PX,y:sy},
              {t:1,  x:sx+17*YARD_PX,y:clampY(sy+d.toCenter*7*YARD_PX)}];
    }},
    postCorner: { label:'Post Corner', throwT:0.72, generate(sx,sy,side){
      const d = dirFor(side);
      const y1 = sy;
      const y2 = clampY(sy + d.toCenter*7*YARD_PX);
      const y3 = clampY(y2 + d.toSideline*7*YARD_PX);
      return [{t:0,x:sx,y:sy},
              {t:0.3,x:sx+5*YARD_PX, y:y1},
              {t:0.6,x:sx+12*YARD_PX,y:y2},
              {t:1,  x:sx+13*YARD_PX,y:y3}];
    }},
    stay: { label:'Stay / Block', throwT:0.75, generate(sx,sy){
      return [{t:0,x:sx,y:sy},{t:1,x:sx,y:sy}];
    }}
  };
  const ROUTE_ORDER = ['stay','streak','slant','bubbleL','bubbleR','flatRight','flatLeft','screenL','screenR','out','in','post','postCorner'];

  // ---------- run path library (for the ball carrier on run plays) ----------
  // Each is function(startX,startY) -> LOCAL waypoints, t:0..1 representing
  // just the run itself. The run builder time-shifts these to start
  // wherever the exchange (handoff/toss) actually happens in the play.
  function offTackleArc(sx,sy,dirSign){
    return [{t:0,x:sx,y:sy},
            {t:0.35,x:sx+2*YARD_PX,y:clampY(sy+dirSign*5*YARD_PX)},
            {t:0.6, x:sx+9*YARD_PX,y:clampY(sy+dirSign*6*YARD_PX)},
            {t:1,   x:sx+20*YARD_PX,y:clampY(sy+dirSign*6.5*YARD_PX)}];
  }
  function sweepArc(sx,sy,dirSign){
    return [{t:0,x:sx,y:sy},
            {t:0.25,x:sx+1*YARD_PX,y:clampY(sy+dirSign*8*YARD_PX)},
            {t:1,   x:sx+20*YARD_PX,y:clampY(sy+dirSign*9*YARD_PX)}];
  }
  const RUN_PATHS = {
    dive: { label:'Dive', generate(sx,sy){ return [{t:0,x:sx,y:sy},{t:1,x:sx+20*YARD_PX,y:sy}]; }},
    offTackleLeft: { label:'Off-Tackle (Left)', generate(sx,sy){ return offTackleArc(sx,sy,-1); }},
    offTackleRight: { label:'Off-Tackle (Right)', generate(sx,sy){ return offTackleArc(sx,sy,1); }},
    sweepLeft: { label:'Sweep (Left)', generate(sx,sy){ return sweepArc(sx,sy,-1); }},
    sweepRight: { label:'Sweep (Right)', generate(sx,sy){ return sweepArc(sx,sy,1); }}
  };
  const RUN_PATH_ORDER = ['dive','offTackleLeft','offTackleRight','sweepLeft','sweepRight'];
  const RUN_PATH_KEYS = Object.keys(RUN_PATHS);
  const PATH_ORDER = RUN_PATH_ORDER.concat(ROUTE_ORDER); // combined dropdown: run paths first, then routes

  // ---------- defensive formation & action library ----------
  // A single base shell: 2-2-1 (2 corners, 2 linebackers, 1 safety).
  // CB_L/CB_R: outside, 5 yd off the LOS. LB_L/LB_R: 3 yd off the ball's
  // centerline each way, 2 yd off the LOS. S: 12 yd off the LOS, in line
  // with the offensive center.
  function clampX(x){ return Math.max(60, Math.min(740, x)); }
  const DEF_FORMATION = {
    name: '2-2-1',
    slots: ['CB_L','CB_R','LB_L','LB_R','S'],
    positions(){
      return {
        CB_L: {x: LOS_X+5*YARD_PX, y: clampY(CENTER_Y-(2/3)*HALF_WIDTH)},
        CB_R: {x: LOS_X+5*YARD_PX, y: clampY(CENTER_Y+(2/3)*HALF_WIDTH)},
        LB_L: {x: LOS_X+2*YARD_PX, y: CENTER_Y-3*YARD_PX},
        LB_R: {x: LOS_X+2*YARD_PX, y: CENTER_Y+3*YARD_PX},
        S:    {x: LOS_X+12*YARD_PX, y: CENTER_Y}
      };
    }
  };
  const DEF_PATHS = {
    stay: { label:'Stay', generate(sx,sy){ return [{t:0,x:sx,y:sy},{t:1,x:sx,y:sy}]; }},
    blitz: { label:'Blitz', generate(sx,sy,slot){
      // Corners get an angled edge rush (33° off straight, cutting inside
      // toward the QB) instead of a straight-line charge, since that's how
      // this defense actually runs it.
      if (slot === 'CB_L' || slot === 'CB_R'){
        const angle = 33*Math.PI/180;
        const D = 15*YARD_PX;
        const dyToward = slot === 'CB_L' ? 1 : -1; // angles inward toward the QB
        return [{t:0,x:sx,y:sy},
                {t:1, x:clampX(sx-Math.cos(angle)*D), y:clampY(sy+dyToward*Math.sin(angle)*D)}];
      }
      return [{t:0,x:sx,y:sy},{t:1,x:clampX(sx-15*YARD_PX),y:sy}];
    }},
    dropShallow: { label:'Drop Shallow', generate(sx,sy){ return [{t:0,x:sx,y:sy},{t:1,x:LOS_X+8*YARD_PX,y:sy}]; }},
    dropDeep: { label:'Drop Deep', generate(sx,sy){ return [{t:0,x:sx,y:sy},{t:1,x:LOS_X+18*YARD_PX,y:sy}]; }},
    shiftLeft: { label:'Shift (Left)', generate(sx,sy){ return [{t:0,x:sx,y:sy},{t:1,x:sx,y:clampY(sy-6*YARD_PX)}]; }},
    shiftRight: { label:'Shift (Right)', generate(sx,sy){ return [{t:0,x:sx,y:sy},{t:1,x:sx,y:clampY(sy+6*YARD_PX)}]; }}
  };

          WR:  {x:LOS_X, y: flexSide==='L' ? clampY(CENTER_Y-(2/3)*HALF_WIDTH) : clampY(CENTER_Y+(2/3)*HALF_WIDTH), side:flexSide},
          RB_L:{x:LOS_X-7.5*YARD_PX, y:CENTER_Y-4.5*YARD_PX},
          RB_R:{x:LOS_X-7.5*YARD_PX, y:CENTER_Y+4.5*YARD_PX}

          C:   {x:LOS_X, y:CENTER_Y},
          WR_L:{x:LOS_X, y:clampY(CENTER_Y-(2/3)*HALF_WIDTH), side:'L'},
          WR_R:{x:LOS_X, y:clampY(CENTER_Y+(2/3)*HALF_WIDTH), side:'R'},

    trips: {
      name:'Trips',
      wrSlots:['WR1','WR2','WR3','C'],

        // the standard single-WR split. WR2/WR3 bunch in tight — 3 yards

        const wr2Off = wr1Off - 3*YARD_PX;
        const wr3Off = wr1Off - 6*YARD_PX;
        const sign = flexSide==='L' ? -1 : 1;
        return {
          QB: {x:LOS_X-3*YARD_PX, y:CENTER_Y},
          C:  {x:LOS_X, y:CENTER_Y},
          WR1:{x:LOS_X,          y:clampY(CENTER_Y+sign*wr1Off), side:flexSide},
          WR2:{x:LOS_X-1*YARD_PX,y:clampY(CENTER_Y+sign*wr2Off), side:flexSide},
          WR3:{x:LOS_X-2*YARD_PX,y:clampY(CENTER_Y+sign*wr3Off), side:flexSide}
        };
      }
    }
  };

  // ---------- static field ----------
  function drawField(){
    svg.innerHTML = '';
    const left = 50, right = 750, top = 50, bottom = 450;

    // alternating 5-yard backdrop stripes
    for (let i=0; i<(right-left)/(5*YARD_PX); i++){
      const x = left + i*5*YARD_PX;
      svg.appendChild(el('rect',{x:x,y:top,width:5*YARD_PX,height:bottom-top,
        fill: i%2===0 ? 'rgba(255,255,255,0.02)' : 'rgba(0,0,0,0.05)'}));
    }
    // sidelines
    svg.appendChild(el('rect',{x:left,y:top,width:right-left,height:bottom-top,fill:'none',stroke:'var(--line-white)','stroke-width':2}));

    // minor 1-yard ticks
    for (let x = left; x <= right; x += YARD_PX){
      const yard = Math.round((x - FIELD_LEFT) / YARD_PX);
      if (yard % 5 === 0) continue; // majors drawn separately below
      svg.appendChild(el('line',{x1:x,y1:top,x2:x,y2:bottom,stroke:'var(--line-white)','stroke-width':0.5,opacity:0.22}));
    }
    // major 5-yard lines, labeled with the real field number (0–50)
    for (let x = left; x <= right; x += YARD_PX){
      const yard = Math.round((x - FIELD_LEFT) / YARD_PX);
      if (yard % 5 !== 0 || x === LOS_X) continue;
      svg.appendChild(el('line',{x1:x,y1:top,x2:x,y2:bottom,stroke:'var(--line-white)','stroke-width':1,opacity:0.5}));
      const lbl = svg.appendChild(el('text',{x:x,y:40,fill:'var(--chalk-dim)','font-size':11,'text-anchor':'middle',
        'font-family':'-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif'}));
      lbl.textContent = String(yard);
    }

    // line of scrimmage (fixed at the 20)
    svg.appendChild(el('line',{x1:LOS_X,y1:top,x2:LOS_X,y2:bottom,stroke:'var(--flag-gold)','stroke-width':2,'stroke-dasharray':'6,4','opacity':0.8}));
    svg.appendChild(el('text',{x:LOS_X,y:40,fill:'var(--flag-gold)','font-size':12,'text-anchor':'middle','font-family':'Bradley Hand, Segoe Print, Chalkboard SE, Comic Sans MS, cursive'})).textContent = 'LOS · 20';
    // no-rush arc (5 yd) — decorative
    svg.appendChild(el('path',{d:`M ${LOS_X} ${top} A ${5*YARD_PX} ${5*YARD_PX} 0 0 0 ${LOS_X} ${bottom}`,
      fill:'none', stroke:'var(--line-white)','stroke-width':1,'stroke-dasharray':'3,4'}));
  }

  // ---------- route preview layer ----------
  let routeLayer, playerLayer, ballLayer, readLayer;

  function buildLayers(){
    routeLayer = el('g',{id:'routes'}); svg.appendChild(routeLayer);
    readLayer  = el('g',{id:'reads'});  svg.appendChild(readLayer);
    ballLayer  = el('g',{id:'ball'});   svg.appendChild(ballLayer);
    playerLayer= el('g',{id:'players'});svg.appendChild(playerLayer);
  }

  function drawRoutePreviews(){
    routeLayer.innerHTML = '';
    const play = PLAYS[currentPlay];
    const def = DEFENSES[currentDefense];
    Object.keys(play.routes).forEach(key=>{
      if (key === 'QB') return; // don't show QB drop as a "route"
      const p = el('path',{d:pathFromWaypoints(play.routes[key]), fill:'none',
        stroke:'var(--off-red)','stroke-width':2,'stroke-dasharray':'5,5','opacity':0.35});
      routeLayer.appendChild(p);
    });
    Object.keys(def.routes).forEach(key=>{
      const p = el('path',{d:pathFromWaypoints(def.routes[key]), fill:'none',
        stroke:'var(--def-blue)','stroke-width':2,'stroke-dasharray':'2,5','opacity':0.3});
      routeLayer.appendChild(p);
    });
  }

  const OFF_LABELS = {QB:'QB', C:'C', WR_L:'X', WR_S:'Z', WR_R:'Y', WR:'X', RB_L:'RB', RB_R:'RB', RB:'RB', WR1:'1', WR2:'2', WR3:'3'};
  const DEF_LABELS = {CB_L:'C', CB_R:'C', NB:'N', S1:'S', S2:'S', RUSH:'R', FS:'F', LB_L:'LB', LB_R:'LB', S:'S'};

  // ---------- roster & lineup assignment ----------
  // Static roster — edit this list directly to match your team.
  const ROSTER = []; // roster no longer hardcoded — entered per device

  // Friendly role names shown next to each dropdown. Falls back to the
  // raw key (e.g. "WR_L") for anything not listed here.
  const ROLE_NAMES = {
    QB:'QB', C:'Center', WR:'WR', WR_L:'WR (L)', WR_R:'WR (R)', WR_S:'Slot',
    RB:'RB', RB_L:'RB (L)', RB_R:'RB (R)', WR1:'WR1 (outside)', WR2:'WR2', WR3:'WR3 (inside)'
  };

  // Shared across plays so a player assigned to QB stays the QB no matter
  // which play is selected — keyed by role, e.g. { QB: 'Jake', C: 'Sam' }.
  const ASSIGNMENTS = {};

  function buildLineupPanel(){
    const panel = document.getElementById('lineupPanel');
    panel.innerHTML = '';
    const play = PLAYS[currentPlay];
    Object.keys(play.routes).forEach(key=>{
      const chip = document.createElement('div');
      chip.className = 'lineup-chip';
      const role = document.createElement('span');
      role.className = 'role';
      role.textContent = ROLE_NAMES[key] || key;

      blank.value = ''; blank.textContent = '—';
      select.appendChild(blank);
      ROSTER.forEach(name=>{
        const opt = document.createElement('option');
        opt.value = name; opt.textContent = name;
        if (ASSIGNMENTS[key] === name) opt.selected = true;
        select.appendChild(opt);
      });
      select.onchange = ()=>{
        if (select.value) ASSIGNMENTS[key] = select.value;
        else delete ASSIGNMENTS[key];
        render();
      };
      chip.appendChild(role);
      chip.appendChild(select);
      panel.appendChild(chip);
    });
  }

  // ---------- custom pass builder ----------
  const customPass = {
    formation: 'singleBack',   // 'proSet' | 'singleBack' | 'trips'
    flexSide: 'L',              // which side the flexible WR(s) line up — Pro Set / Trips only
    routes: {},                // slot key -> route name, e.g. { WR_L:'slant', WR_R:'flatRight' }
    target: null                // slot key the QB throws to
  };

  function regenerateCustomPass(){
    const formation = FORMATIONS[customPass.formation];
    const positions = formation.positions(customPass.flexSide);
    const routes = {};

    Object.keys(positions).forEach(slot=>{
      const pos = positions[slot];
      if (slot === 'QB'){
        routes.QB = [{t:0,x:pos.x,y:pos.y},{t:0.25,x:pos.x-4*YARD_PX,y:pos.y},{t:1,x:pos.x-4.3*YARD_PX,y:pos.y+3}];
      } else if (formation.wrSlots.includes(slot)){
        if (!customPass.routes[slot]) customPass.routes[slot] = slot.startsWith('WR') ? 'streak' : 'stay';
        const routeDef = ROUTES[customPass.routes[slot]];
        const side = pos.side || (pos.y < CENTER_Y ? 'L' : 'R'); // non-WR slots (C, RB) infer break direction from their side of the field
        routes[slot] = routeDef.generate(pos.x, pos.y, side);
      } else {
        routes[slot] = [{t:0,x:pos.x,y:pos.y},{t:1,x:pos.x,y:pos.y}]; // fallback: holds position
      }
    });

    if (!formation.wrSlots.includes(customPass.target)) customPass.target = formation.wrSlots[0];
    const targetRouteDef = ROUTES[customPass.routes[customPass.target]];

    PLAYS.customPass.routes = routes;
    PLAYS.customPass.reads = [
      {t: Math.max(0.05, targetRouteDef.throwT - 0.12), label: 'Read: ' + targetRouteDef.label, target: customPass.target}
    ];
    PLAYS.customPass.throw = {t0: targetRouteDef.throwT, t1: targetRouteDef.throwT + 0.08, from:'QB', to: customPass.target, type:'pass'};

    const routeSummary = formation.wrSlots.map(s => (ROLE_NAMES[s]||s) + ': ' + ROUTES[customPass.routes[s]].label).join(', ');
    PLAYS.customPass.desc = `<b>Custom Pass — ${formation.name}.</b> ${routeSummary}. Throwing to ${ROLE_NAMES[customPass.target]||customPass.target}.`;
  }

  function buildBuilderPanel(){
    const panel = document.getElementById('builderPanel');
    panel.innerHTML = '';
    const formation = FORMATIONS[customPass.formation];

    // formation selector
    const fChip = document.createElement('div');
    fChip.className = 'lineup-chip';
    const fRole = document.createElement('span'); fRole.className='role'; fRole.textContent='Formation';
    const fSelect = document.createElement('select');
    Object.keys(FORMATIONS).forEach(key=>{
      const opt = document.createElement('option');
      opt.value = key; opt.textContent = FORMATIONS[key].name;
      if (key === customPass.formation) opt.selected = true;
      fSelect.appendChild(opt);
    });
    fSelect.onchange = ()=>{
      customPass.formation = fSelect.value;
      customPass.routes = {};
      customPass.target = null;
      regenerateCustomPass();
      drawRoutePreviews();
      buildBuilderPanel();
      buildLineupPanel();
      render();
    };
    fChip.appendChild(fRole); fChip.appendChild(fSelect);
    panel.appendChild(fChip);

    // route selector per WR slot
    formation.wrSlots.forEach(slot=>{
      const chip = document.createElement('div');
      chip.className = 'lineup-chip';
      const role = document.createElement('span'); role.className='role'; role.textContent = ROLE_NAMES[slot]||slot;
      const select = document.createElement('select');
      ROUTE_ORDER.forEach(rKey=>{
        const opt = document.createElement('option');
        opt.value = rKey; opt.textContent = ROUTES[rKey].label;
        if ((customPass.routes[slot] || (slot.startsWith('WR') ? 'streak' : 'stay')) === rKey) opt.selected = true;
        select.appendChild(opt);
      });
      select.onchange = ()=>{
        customPass.routes[slot] = select.value;
        regenerateCustomPass();
        drawRoutePreviews();
        buildBuilderPanel();
        render();
      };
      chip.appendChild(role); chip.appendChild(select);
      panel.appendChild(chip);
    });

    // target (who gets the ball) selector
    const tChip = document.createElement('div');
    tChip.className = 'lineup-chip';
    const tRole = document.createElement('span'); tRole.className='role'; tRole.textContent='Throw to';
    const tSelect = document.createElement('select');
    formation.wrSlots.forEach(slot=>{
      const opt = document.createElement('option');
      opt.value = slot; opt.textContent = ROLE_NAMES[slot]||slot;
      if (customPass.target === slot) opt.selected = true;
      tSelect.appendChild(opt);
    });
    tSelect.onchange = ()=>{
      customPass.target = tSelect.value;
      regenerateCustomPass();
      render();
    };
    tChip.appendChild(tRole); tChip.appendChild(tSelect);
    panel.appendChild(tChip);

    // flip button
    const flipBtn = document.createElement('button');
    flipBtn.className = 'builder-flip';
    flipBtn.textContent = '⇋ Flip formation';
    flipBtn.onclick = ()=>{
      if (customPass.formation === 'proSet' || customPass.formation === 'trips'){
        customPass.flexSide = customPass.flexSide === 'L' ? 'R' : 'L';
      } else {
        const tmp = customPass.routes.WR_L;
        customPass.routes.WR_L = customPass.routes.WR_R;
        customPass.routes.WR_R = tmp;
      }
      regenerateCustomPass();
      drawRoutePreviews();
      buildBuilderPanel();
      render();
    };
    panel.appendChild(flipBtn);
  }

  // ---------- custom run builder ----------
  const customRun = {
    formation: 'proSet',       // 'proSet' | 'singleBack' | 'trips'
    flexSide: 'L',
    qbAction: 'handoff',       // 'handoff' | 'delayedHandoff' | 'toss'
    paths: {},                 // slot key -> path key (from PATH_ORDER)
    goesTo: null                // slot key that actually carries the ball
  };

  function pathDefFor(key){ return RUN_PATH_KEYS.includes(key) ? RUN_PATHS[key] : ROUTES[key]; }

  function regenerateCustomRun(){
    const formation = FORMATIONS[customRun.formation];
    const positions = formation.positions(customRun.flexSide);
    const slots = formation.wrSlots; // all non-QB assignable slots
    const routes = {};

    slots.forEach(slot=>{ if (!customRun.paths[slot]) customRun.paths[slot] = 'stay'; });
    if (!slots.includes(customRun.goesTo)){
      customRun.goesTo = slots.find(s=>s.startsWith('RB')) || slots.find(s=>s.startsWith('WR')) || slots[0];
      if (customRun.paths[customRun.goesTo] === 'stay') customRun.paths[customRun.goesTo] = 'dive';
    }

    const carrierSlot = customRun.goesTo;
    const carrierPos = positions[carrierSlot];
    const carrierIsWR = carrierSlot.startsWith('WR');
    const carrierPathKey = customRun.paths[carrierSlot];
    const carrierSide = carrierPos.side || (carrierPos.y < CENTER_Y ? 'L' : 'R');
    const qbPos = positions.QB;

    let carrierWaypoints, qbWaypoints, throwT0, throwT1;

    if (customRun.qbAction === 'toss'){
      // No mesh point — the carrier's path runs from the snap; QB pitches mid-stride.
      carrierWaypoints = pathDefFor(carrierPathKey).generate(carrierPos.x, carrierPos.y, carrierSide);
      qbWaypoints = [{t:0,x:qbPos.x,y:qbPos.y},{t:0.15,x:qbPos.x-2*YARD_PX,y:qbPos.y},{t:1,x:qbPos.x-2*YARD_PX,y:qbPos.y+3}];
      throwT0 = 0.12; throwT1 = 0.2;
    } else {
      // Handoff / Delayed Handoff share the same mechanic: exchange fires
      // once the carrier is available — instantly for a nearby RB (who
      // just stays put), or after real travel time for a WR crossing in
      // from a wide alignment. Delayed Handoff forces a long hold regardless.
      const HOLD = {handoff:0.2, delayedHandoff:0.68};
      const travelT = carrierIsWR ? 0.35 : 0.05;
      const exchangeT = Math.max(HOLD[customRun.qbAction], travelT);

      const originX = carrierIsWR ? (qbPos.x - 1*YARD_PX) : carrierPos.x;
      const originY = carrierIsWR ? qbPos.y : carrierPos.y;

      const preWaypoints = carrierIsWR
        ? [{t:0,x:carrierPos.x,y:carrierPos.y},{t:exchangeT,x:originX,y:originY}]   // WR travels to QB
        : [{t:0,x:carrierPos.x,y:carrierPos.y},{t:exchangeT,x:carrierPos.x,y:carrierPos.y}]; // RB stays put

      const localWps = pathDefFor(carrierPathKey).generate(originX, originY, carrierSide);
      const postWaypoints = localWps.slice(1).map(wp => ({ t: exchangeT + wp.t*(1-exchangeT), x: wp.x, y: wp.y }));
      carrierWaypoints = preWaypoints.concat(postWaypoints);

      if (carrierIsWR){
        // QB stays near his own drop, waiting for the WR to arrive.
        qbWaypoints = [{t:0,x:qbPos.x,y:qbPos.y},{t:0.2,x:qbPos.x-2*YARD_PX,y:qbPos.y},{t:1,x:qbPos.x-2*YARD_PX,y:qbPos.y+3}];
      } else {
        // QB travels to the RB at a fixed, quick pace — identical speed
        // whether it's a Handoff or Delayed Handoff. Any extra delay is a
        // hold AT the RB (the exchange still fires at exchangeT), not a
        // slower approach — this is what makes Delayed Handoff read as a
        // play-action pass fake that resolves into a draw, not just a
        // generically slow handoff.
        const approachT = 0.18;
        qbWaypoints = [{t:0,x:qbPos.x,y:qbPos.y},
                        {t:approachT,x:carrierPos.x+2*YARD_PX,y:carrierPos.y},
                        {t:exchangeT,x:carrierPos.x+1*YARD_PX,y:carrierPos.y},
                        {t:1,x:carrierPos.x+1*YARD_PX,y:carrierPos.y+3}];
      }
      throwT0 = Math.max(0, exchangeT-0.02); throwT1 = exchangeT+0.03;
    }

    routes[carrierSlot] = carrierWaypoints;
    routes.QB = qbWaypoints;

    // Everyone else runs their assigned path independently (decoy/fake motion, no ball).
    slots.forEach(slot=>{
      if (slot === carrierSlot) return;
      const pos = positions[slot];
      const side = pos.side || (pos.y < CENTER_Y ? 'L' : 'R');
      routes[slot] = pathDefFor(customRun.paths[slot]).generate(pos.x, pos.y, side);
    });

    PLAYS.customRun.routes = routes;
    const carrierPathLabel = pathDefFor(carrierPathKey).label;
    PLAYS.customRun.reads = [
      {t: Math.max(0.05, throwT0-0.08), label: QB_ACTION_LABELS[customRun.qbAction]+' → '+(ROLE_NAMES[carrierSlot]||carrierSlot), target: carrierSlot}
    ];
    PLAYS.customRun.throw = {t0:throwT0, t1:throwT1, from:'QB', to:carrierSlot, type:'handoff'};
    PLAYS.customRun.desc = `<b>Custom Run — ${formation.name}.</b> ${QB_ACTION_LABELS[customRun.qbAction]} to ${ROLE_NAMES[carrierSlot]||carrierSlot} (${carrierPathLabel}).`;
  }

  function buildRunBuilderPanel(){
    const panel = document.getElementById('runBuilderPanel');
    panel.innerHTML = '';
    const formation = FORMATIONS[customRun.formation];

    function makeSelect(labelText, options, currentValue, onChange){
      const chip = document.createElement('div');
      chip.className = 'lineup-chip';
      const role = document.createElement('span'); role.className='role'; role.textContent = labelText;
      const select = document.createElement('select');
      options.forEach(([val,text])=>{
        const opt = document.createElement('option');
        opt.value = val; opt.textContent = text;
        if (val === currentValue) opt.selected = true;
        select.appendChild(opt);
      });
      select.onchange = ()=> onChange(select.value);
      chip.appendChild(role); chip.appendChild(select);
      panel.appendChild(chip);
    }

    // Same as makeSelect, but splits options into "Run:" and "Pass:" optgroups.
    function makePathSelect(labelText, currentValue, onChange){
      const chip = document.createElement('div');
      chip.className = 'lineup-chip';
      const role = document.createElement('span'); role.className='role'; role.textContent = labelText;
      const select = document.createElement('select');

      const runGroup = document.createElement('optgroup'); runGroup.label = 'Run:';
      RUN_PATH_ORDER.forEach(k=>{
        const opt = document.createElement('option');
        opt.value = k; opt.textContent = RUN_PATHS[k].label;
        if (k === currentValue) opt.selected = true;
        runGroup.appendChild(opt);
      });
      const passGroup = document.createElement('optgroup'); passGroup.label = 'Pass:';
      ROUTE_ORDER.forEach(k=>{
        const opt = document.createElement('option');
        opt.value = k; opt.textContent = ROUTES[k].label;
        if (k === currentValue) opt.selected = true;
        passGroup.appendChild(opt);
      });
      select.appendChild(runGroup);
      select.appendChild(passGroup);
      select.onchange = ()=> onChange(select.value);
      chip.appendChild(role); chip.appendChild(select);
      panel.appendChild(chip);
    }

    // formation
    makeSelect('Formation', Object.keys(FORMATIONS).map(k=>[k,FORMATIONS[k].name]), customRun.formation, (val)=>{
      customRun.formation = val;
      customRun.paths = {};
      customRun.goesTo = null;
      regenerateCustomRun();
      drawRoutePreviews();
      buildRunBuilderPanel();
      buildLineupPanel();
      render();
    });

    // QB action
    makeSelect('QB Action', Object.keys(QB_ACTION_LABELS).map(k=>[k,QB_ACTION_LABELS[k]]), customRun.qbAction, (val)=>{
      customRun.qbAction = val;
      regenerateCustomRun();
      drawRoutePreviews();
      render();
    });

    // path per non-QB slot
    formation.wrSlots.forEach(slot=>{
      makePathSelect(ROLE_NAMES[slot]||slot, customRun.paths[slot]||'stay', (val)=>{
        customRun.paths[slot] = val;
        regenerateCustomRun();
        drawRoutePreviews();
        buildRunBuilderPanel();
        render();
      });
    });


    // goes to
    makeSelect('Goes to', formation.wrSlots.map(s=>[s,ROLE_NAMES[s]||s]), customRun.goesTo, (val)=>{
      customRun.goesTo = val;
      regenerateCustomRun();
      drawRoutePreviews();
      render();
    });

    // flip
    const flipBtn = document.createElement('button');
    flipBtn.className = 'builder-flip';
    flipBtn.textContent = '⇋ Flip formation';
    flipBtn.onclick = ()=>{
      if (customRun.formation === 'proSet'){
        customRun.flexSide = customRun.flexSide === 'L' ? 'R' : 'L';
        const tmp = customRun.paths.RB_L; customRun.paths.RB_L = customRun.paths.RB_R; customRun.paths.RB_R = tmp;
        if (customRun.goesTo === 'RB_L') customRun.goesTo = 'RB_R';
        else if (customRun.goesTo === 'RB_R') customRun.goesTo = 'RB_L';
      } else if (customRun.formation === 'trips'){
        customRun.flexSide = customRun.flexSide === 'L' ? 'R' : 'L';
      } else {
        const tmp = customRun.paths.WR_L; customRun.paths.WR_L = customRun.paths.WR_R; customRun.paths.WR_R = tmp;
        if (customRun.goesTo === 'WR_L') customRun.goesTo = 'WR_R';
        else if (customRun.goesTo === 'WR_R') customRun.goesTo = 'WR_L';
      }
      regenerateCustomRun();
      drawRoutePreviews();
      buildRunBuilderPanel();
      render();
    };
    panel.appendChild(flipBtn);
  }

  // ---------- custom defense builder ----------
  const customDefense = { paths: {} }; // slot key -> DEF_PATH_ORDER key

  function regenerateCustomDefense(){
    const positions = DEF_FORMATION.positions();
    const routes = {};
    DEF_FORMATION.slots.forEach(slot=>{
      if (!customDefense.paths[slot]) customDefense.paths[slot] = 'stay';
      const pos = positions[slot];
      routes[slot] = DEF_PATHS[customDefense.paths[slot]].generate(pos.x, pos.y, slot);
    });
    DEFENSES.customDefense.routes = routes;
    const summary = DEF_FORMATION.slots
      .filter(s => customDefense.paths[s] !== 'stay')
      .map(s => (DEF_ROLE_NAMES[s]||s) + ': ' + DEF_PATHS[customDefense.paths[s]].label)
      .join(', ');
    DEFENSES.customDefense.desc = `<b>Custom Defense — 2-2-1.</b> ${summary || 'Everyone holding their base alignment.'}`;
  }

  function buildDefenseBuilderPanel(){
    const panel = document.getElementById('defenseBuilderPanel');
    panel.innerHTML = '';
    DEF_FORMATION.slots.forEach(slot=>{
      const chip = document.createElement('div');
      chip.className = 'lineup-chip';
      const role = document.createElement('span'); role.className='role'; role.textContent = DEF_ROLE_NAMES[slot]||slot;
      const select = document.createElement('select');
      DEF_PATH_ORDER.forEach(k=>{
        const opt = document.createElement('option');
        opt.value = k; opt.textContent = DEF_PATHS[k].label;
        if ((customDefense.paths[slot]||'stay') === k) opt.selected = true;
        select.appendChild(opt);
      });
      select.onchange = ()=>{
        customDefense.paths[slot] = select.value;
        regenerateCustomDefense();
        drawRoutePreviews();
        render();
      };
      chip.appendChild(role); chip.appendChild(select);
      panel.appendChild(chip);
    });
  }

  // Defense roster assignment — mirrors the offense lineup panel, but
  // works across ALL defenses (Cover 2, Man-Free, Custom Defense), not
  // just the custom one, same as offense's lineup panel does for every play.
  const DEF_ASSIGNMENTS = {};

  function buildDefenseLineupPanel(){
    const panel = document.getElementById('defenseLineupPanel');
    panel.innerHTML = '';
    const def = DEFENSES[currentDefense];
    Object.keys(def.routes).forEach(key=>{
      const chip = document.createElement('div');
      chip.className = 'lineup-chip';
      const role = document.createElement('span');
      role.className = 'role';
      role.textContent = DEF_ROLE_NAMES[key] || key;
      const select = document.createElement('select');
      const blank = document.createElement('option');
      blank.value = ''; blank.textContent = '—';
      select.appendChild(blank);
      ROSTER.forEach(name=>{
        const opt = document.createElement('option');
        opt.value = name; opt.textContent = name;
        if (DEF_ASSIGNMENTS[key] === name) opt.selected = true;
        select.appendChild(opt);
      });
      select.onchange = ()=>{
        if (select.value) DEF_ASSIGNMENTS[key] = select.value;
        else delete DEF_ASSIGNMENTS[key];
        render();
      };
      chip.appendChild(role);
      chip.appendChild(select);
      panel.appendChild(chip);
    });
  }

  function drawPlayers(){
    playerLayer.innerHTML = '';
    const play = PLAYS[currentPlay];
    const def = DEFENSES[currentDefense];
    const offenseTappable = interactionMode === 'tap' && (currentPlay === 'customPass' || currentPlay === 'customRun');
    const defenseTappable = interactionMode === 'tap' && currentDefense === 'customDefense';

    Object.keys(play.routes).forEach(key=>{
      const pos = getPosAtT(play.routes[key], t);
      const g = el('g',{});
      g.appendChild(el('circle',{cx:pos.x, cy:pos.y, r:20, fill:'var(--off-red)', stroke:'#2a0a08','stroke-width':1.5}));
      const assigned = ASSIGNMENTS[key];
      const label = assigned ? (assigned.length > 6 ? assigned.slice(0,6) : assigned) : (OFF_LABELS[key] || key);
      const txt = el('text',{x:pos.x, y:pos.y+4, 'text-anchor':'middle',
        'font-size': assigned ? 10.5 : 14, 'font-weight':700, fill:'#fff',
        'font-family':'-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif'});
      txt.textContent = label;
      g.appendChild(txt);
      if (offenseTappable){
        g.classList.add('tappable');
        g.onclick = ()=> openAssignSheet(key, 'offense');
      }
      playerLayer.appendChild(g);
    });

    Object.keys(def.routes).forEach(key=>{
      const pos = getPosAtT(def.routes[key], t);
      const g = el('g',{});
      g.appendChild(el('circle',{cx:pos.x, cy:pos.y, r:18, fill:'none', stroke:'var(--def-blue)','stroke-width':3}));
      const assigned = DEF_ASSIGNMENTS[key];
      const label = assigned ? (assigned.length > 6 ? assigned.slice(0,6) : assigned) : (DEF_LABELS[key] || key);
      const txt = el('text',{x:pos.x, y:pos.y+5, 'text-anchor':'middle',
        'font-size': assigned ? 10.5 : 13, 'font-weight':700, fill:'var(--def-blue)',
        'font-family':'-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif'});
      txt.textContent = label;
      g.appendChild(txt);
      if (defenseTappable){
        g.classList.add('tappable');
        g.onclick = ()=> openAssignSheet(key, 'defense');
      }
      playerLayer.appendChild(g);
    });
  }

  function drawBall(){
    ballLayer.innerHTML = '';
    const play = PLAYS[currentPlay];
    const th = play.throw;
    if (!th) return;
    if (t < th.t0){
      // ball with QB
      const qbPos = getPosAtT(play.routes.QB, t);
      ballLayer.appendChild(el('circle',{cx:qbPos.x+10, cy:qbPos.y, r:4, fill:'var(--flag-gold)'}));
    } else if (t <= th.t1){
      const local = (t - th.t0) / (th.t1 - th.t0 || 1);
      const fromPos = getPosAtT(play.routes[th.from], th.t0);
      const toPos = getPosAtT(play.routes[th.to], th.t1);
      const arc = th.type === 'handoff' ? 0 : 30; // handoffs travel flat, passes arc
      const bx = fromPos.x + (toPos.x - fromPos.x) * local;
      const by = fromPos.y + (toPos.y - fromPos.y) * local - Math.sin(local*Math.PI)*arc;
      ballLayer.appendChild(el('circle',{cx:bx, cy:by, r:5, fill:'var(--flag-gold)', stroke:'#7a5c12','stroke-width':1}));
    } else {
      const pos = getPosAtT(play.routes[th.to], t);
      ballLayer.appendChild(el('circle',{cx:pos.x-16, cy:pos.y, r:4, fill:'var(--flag-gold)'}));
    }
  }

  function drawReadBadge(){
    readLayer.innerHTML = '';
    const play = PLAYS[currentPlay];
    let active = null;
    for (const r of play.reads){
      if (t >= r.t) active = r;
    }
    if (!active) return;
    const pos = getPosAtT(play.routes[active.target], Math.max(t, active.t));
    const label = active.label;
    const w = Math.max(70, label.length*6.2);
    const g = el('g',{opacity:0.95});
    g.appendChild(el('rect',{x:pos.x-w/2, y:pos.y-38, width:w, height:20, rx:10,
      fill:'rgba(227,178,60,0.15)', stroke:'var(--flag-gold)','stroke-width':1}));
    const txt = el('text',{x:pos.x, y:pos.y-24, 'text-anchor':'middle','font-size':10.5,
      'font-family':'Bradley Hand, Segoe Print, Chalkboard SE, Comic Sans MS, cursive', fill:'var(--flag-gold)'});
    txt.textContent = label;
    g.appendChild(txt);
    readLayer.appendChild(g);
  }

  function updatePhaseBadge(){
    const play = PLAYS[currentPlay];
    const badge = document.getElementById('phaseBadge');
    if (t <= 0.02) { badge.textContent = 'Pre-snap'; return; }
    if (t >= 0.98) { badge.textContent = 'Play over'; return; }
    let active = null;
    for (const r of play.reads){ if (t >= r.t) active = r; }
    const th = play.throw;
    const isHandoff = th && th.type === 'handoff';
    if (th && t >= th.t0 && t <= th.t1){ badge.textContent = isHandoff ? 'Handoff' : 'Ball in the air'; return; }
    if (th && t > th.t1){ badge.textContent = isHandoff ? 'Ball carrier running' : 'Yards after catch'; return; }
    badge.textContent = active ? active.label : 'Snap!';
  }

  function render(){
    drawPlayers();
    drawBall();
    drawReadBadge();
    updatePhaseBadge();
    document.getElementById('scrub').value = Math.round(t*1000);
  }

  function setPlay(key){
    currentPlay = key;
    t = 0; playing = false;
    document.getElementById('playBtn').textContent = '▶';
    const builderDetails = document.getElementById('builderDetails');
    const runBuilderDetails = document.getElementById('runBuilderDetails');
    if (key === 'customPass'){
      builderDetails.style.display = 'block';
      regenerateCustomPass();
      buildBuilderPanel();
    } else {
      builderDetails.style.display = 'none';
    }
    if (key === 'customRun'){
      runBuilderDetails.style.display = 'block';
      regenerateCustomRun();
      buildRunBuilderPanel();
    } else {
      runBuilderDetails.style.display = 'none';
    }
    document.getElementById('playDesc').innerHTML = PLAYS[key].desc;
    document.querySelectorAll('#playTabs .tab').forEach(b=> b.classList.toggle('active', b.dataset.key===key));
    drawRoutePreviews();
    buildLineupPanel();
    render();
  }

  function setDefense(key){
    currentDefense = key;
    const defenseBuilderDetails = document.getElementById('defenseBuilderDetails');
    if (key === 'customDefense'){
      defenseBuilderDetails.style.display = 'block';
      regenerateCustomDefense();
      buildDefenseBuilderPanel();
    } else {
      defenseBuilderDetails.style.display = 'none';
    }
    document.querySelectorAll('#defenseTabs .tab').forEach(b=> b.classList.toggle('active', b.dataset.key===key));
    drawRoutePreviews();
    buildDefenseLineupPanel();
    render();
  }

  function buildTabs(){
    const playTabs = document.getElementById('playTabs');
    Object.keys(PLAYS).forEach(key=>{
      const b = document.createElement('button');
      b.className = 'tab'; b.textContent = PLAYS[key].name; b.dataset.key = key;
      b.onclick = ()=> setPlay(key);
      playTabs.appendChild(b);
    });
    const defTabs = document.getElementById('defenseTabs');
    Object.keys(DEFENSES).forEach(key=>{
      const b = document.createElement('button');
      b.className = 'tab'; b.textContent = DEFENSES[key].name; b.dataset.key = key;
      b.onclick = ()=> setDefense(key);
      defTabs.appendChild(b);
    });
  }

  // ---------- playback loop ----------
  function tick(ts){
    if (!playing) { lastTs = null; return; }
    if (lastTs === null) lastTs = ts;
    const dt = (ts - lastTs) / 1000;
    lastTs = ts;
    t += dt * speed;
    if (t >= 1){ t = 1; playing = false; document.getElementById('playBtn').textContent = '▶'; }
    render();
    if (playing) requestAnimationFrame(tick);
  }

  document.getElementById('playBtn').onclick = ()=>{
    if (t >= 1) t = 0;
    playing = !playing;
    document.getElementById('playBtn').textContent = playing ? '❚❚' : '▶';
    if (playing){ lastTs = null; requestAnimationFrame(tick); }
  };
  document.getElementById('resetBtn').onclick = ()=>{
    t = 0; playing = false; document.getElementById('playBtn').textContent = '▶'; render();
  };
  document.getElementById('stepFwdBtn').onclick = ()=>{
    playing = false; document.getElementById('playBtn').textContent = '▶';
    t = Math.min(1, t + 0.08); render();
  };
  document.getElementById('stepBackBtn').onclick = ()=>{
    playing = false; document.getElementById('playBtn').textContent = '▶';
    t = Math.max(0, t - 0.08); render();
  };
  document.getElementById('scrub').oninput = (e)=>{
    playing = false; document.getElementById('playBtn').textContent = '▶';
    t = Number(e.target.value) / 1000; render();
  };
  document.getElementById('speedSelect').onchange = (e)=>{
    speed = Number(e.target.value);
  };

  // ---------- offense/defense mode toggle ----------
  // Purely a UI-declutter toggle: both offense and defense still animate
  // together on the field regardless of mode. This just controls which
  // set of tabs/builder panels are visible, so mobile isn't showing both
  // control sets — and every future control (defense builder, etc.) has
  // a natural home to slot into.
  let currentMode = 'offense';
  function setMode(mode){
    currentMode = mode;
    document.getElementById('offenseControls').style.display = mode === 'offense' ? 'block' : 'none';
    document.getElementById('defenseControls').style.display = mode === 'defense' ? 'block' : 'none';
    document.getElementById('modeOffenseBtn').classList.toggle('active', mode === 'offense');
    document.getElementById('modeDefenseBtn').classList.toggle('active', mode === 'defense');
    buildTapControls();
  }
  document.getElementById('modeOffenseBtn').onclick = ()=> setMode('offense');
  document.getElementById('modeDefenseBtn').onclick = ()=> setMode('defense');

  // ---------- interaction mode: Classic (dropdowns) vs Tap to Assign ----------
  // Both modes edit the exact same customPass/customRun/customDefense
  // state through the exact same regenerate functions — this is a true
  // A/B of the *interaction*, not two separate builders to keep in sync.
  let interactionMode = 'classic';  // 'classic' | 'tap'
  let tapSubMode = 'pass';          // 'pass' | 'run' — offense only

  function setInteractionMode(mode){
    interactionMode = mode;
    document.getElementById('interactionClassicBtn').classList.toggle('active', mode === 'classic');
    document.getElementById('interactionTapBtn').classList.toggle('active', mode === 'tap');
    document.getElementById('tapControls').style.display = mode === 'tap' ? 'flex' : 'none';
    document.getElementById('offenseTabsRow').style.display = mode === 'tap' ? 'none' : 'flex';
    document.getElementById('defenseTabsRow').style.display = mode === 'tap' ? 'none' : 'flex';

    const builderDetails = document.getElementById('builderDetails');
    const runBuilderDetails = document.getElementById('runBuilderDetails');
    const defenseBuilderDetails = document.getElementById('defenseBuilderDetails');
    const lineupDetails = document.getElementById('lineupDetails');
    const defenseLineupDetails = document.getElementById('defenseLineupDetails');

    if (mode === 'tap'){
      // Force the live play/defense to whichever custom one this tap
      // session is building, so there's always something tappable.
      setPlay(tapSubMode === 'pass' ? 'customPass' : 'customRun');
      setDefense('customDefense');
      builderDetails.style.display = 'none';
      runBuilderDetails.style.display = 'none';
      defenseBuilderDetails.style.display = 'none';
      lineupDetails.style.display = 'none';
      defenseLineupDetails.style.display = 'none';
    } else {
      builderDetails.style.display = currentPlay === 'customPass' ? 'block' : 'none';
      runBuilderDetails.style.display = currentPlay === 'customRun' ? 'block' : 'none';
      defenseBuilderDetails.style.display = currentDefense === 'customDefense' ? 'block' : 'none';
      lineupDetails.style.display = 'block';
      defenseLineupDetails.style.display = 'block';
    }
    buildTapControls();
    drawRoutePreviews();
    render();
  }
  document.getElementById('interactionClassicBtn').onclick = ()=> setInteractionMode('classic');
  document.getElementById('interactionTapBtn').onclick = ()=> setInteractionMode('tap');

  function buildTapControls(){
    const panel = document.getElementById('tapControls');
    panel.innerHTML = '';
    if (interactionMode !== 'tap') return;

    if (currentMode === 'offense'){
      const subWrap = document.createElement('div');
      subWrap.style.display = 'flex'; subWrap.style.gap = '6px';
      [['pass','Pass'],['run','Run']].forEach(([sub,label])=>{
        const b = document.createElement('button');
        b.className = 'subtoggle-btn' + (tapSubMode===sub ? ' active' : '');
        b.textContent = label;
        b.onclick = ()=>{
          tapSubMode = sub;
          setPlay(sub === 'pass' ? 'customPass' : 'customRun');
          buildTapControls();
          drawRoutePreviews();
          render();
        };
        subWrap.appendChild(b);
      });
      panel.appendChild(subWrap);

      const activeCustom = tapSubMode === 'pass' ? customPass : customRun;
      const formWrap = document.createElement('div');
      formWrap.style.display = 'flex'; formWrap.style.gap = '6px';
      Object.keys(FORMATIONS).forEach(fKey=>{
        const b = document.createElement('button');
        b.className = 'formation-btn' + (activeCustom.formation===fKey ? ' active' : '');
        b.textContent = FORMATIONS[fKey].name;
        b.onclick = ()=>{
          activeCustom.formation = fKey;
          if (tapSubMode === 'pass'){ customPass.routes = {}; customPass.target = null; regenerateCustomPass(); buildBuilderPanel(); }
          else { customRun.paths = {}; customRun.goesTo = null; regenerateCustomRun(); buildRunBuilderPanel(); }
          drawRoutePreviews();
          buildTapControls();
          render();
        };
        formWrap.appendChild(b);
      });
      panel.appendChild(formWrap);

      const hint = document.createElement('div');
      hint.className = 'tap-hint';
      hint.textContent = 'Tap a player on the field to assign their ' + (tapSubMode === 'pass' ? 'route.' : 'action.');
      panel.appendChild(hint);
    } else {
      const hint = document.createElement('div');
      hint.className = 'tap-hint';
      hint.textContent = 'Tap a defender on the field to assign their action.';
      panel.appendChild(hint);
    }
  }

  // ---------- assign sheet (the tap-to-assign popup) ----------
  function closeAssignSheet(){
    document.getElementById('assignSheetRoot').innerHTML = '';
  }

  // Roster row — same idea as the Lineup panel, just inline in the sheet.
  function renderSheetRoster(sheet, slot, assignmentsObj, onChange){
    const lbl = document.createElement('div');
    lbl.className = 'assign-group-label';
    lbl.textContent = 'Player';
    sheet.appendChild(lbl);
    const grid = document.createElement('div');
    grid.className = 'assign-options';
    const blank = document.createElement('button');
    blank.className = 'assign-option-btn' + (!assignmentsObj[slot] ? ' current' : '');
    blank.textContent = '—';
    blank.onclick = ()=>{ delete assignmentsObj[slot]; onChange(); rerenderSheetBody(); };
    grid.appendChild(blank);
    ROSTER.forEach(name=>{
      const b = document.createElement('button');
      b.className = 'assign-option-btn' + (assignmentsObj[slot] === name ? ' current' : '');
      b.textContent = name;
      b.onclick = ()=>{ assignmentsObj[slot] = name; onChange(); rerenderSheetBody(); };
      grid.appendChild(b);
    });
    sheet.appendChild(grid);
  }

  function renderSheetOptionGroups(sheet, currentLabel, groups, currentVal, onAssign){
    const cur = document.createElement('p'); cur.className = 'assign-current';
    cur.textContent = 'Currently: ' + currentLabel;
    sheet.appendChild(cur);
    groups.forEach(group=>{
      if (group.label){
        const lbl = document.createElement('div');
        lbl.className = 'assign-group-label';
        lbl.textContent = group.label;
        sheet.appendChild(lbl);
      }
      const grid = document.createElement('div');
      grid.className = 'assign-options';
      group.options.forEach(opt=>{
        const b = document.createElement('button');
        b.className = 'assign-option-btn' + (opt.value === currentVal ? ' current' : '');
        b.textContent = opt.label;
        b.onclick = ()=>{ onAssign(opt.value); rerenderSheetBody(); };
        grid.appendChild(b);
      });
      sheet.appendChild(grid);
    });
  }

  // "Gets the ball" toggle — explicit, not inferred from whatever was
  // assigned last. isCurrent()/setCurrent() let this work for both the
  // Pass target and the Run ball carrier with the same UI.
  function renderSheetBallToggle(sheet, isCurrent, setCurrent){
    const lbl = document.createElement('div');
    lbl.className = 'assign-group-label';
    lbl.textContent = 'Ball';
    sheet.appendChild(lbl);
    const b = document.createElement('button');
    b.className = 'assign-option-btn' + (isCurrent() ? ' current' : '');
    b.style.width = '100%';
    b.textContent = isCurrent() ? '🏈 Gets the ball' : 'Gets the ball?';
    b.onclick = ()=>{ setCurrent(); rerenderSheetBody(); };
    sheet.appendChild(b);
  }

  // Re-draws just the sheet's contents (not the backdrop) so repeated
  // taps inside one sheet visit don't require re-opening it.
  let currentSheetRender = null;
  function rerenderSheetBody(){
    regenerateActivePlay();
    drawRoutePreviews();
    render();
    if (currentSheetRender) currentSheetRender();
  }
  function regenerateActivePlay(){
    if (currentDefense === 'customDefense'){ regenerateCustomDefense(); buildDefenseBuilderPanel(); }
    if (currentPlay === 'customPass'){ regenerateCustomPass(); buildBuilderPanel(); }
    if (currentPlay === 'customRun'){ regenerateCustomRun(); buildRunBuilderPanel(); }
  }

  function openAssignSheet(slot, side){
    const root = document.getElementById('assignSheetRoot');
    const backdrop = document.createElement('div');
    backdrop.className = 'assign-sheet-backdrop';
    backdrop.onclick = (e)=>{ if (e.target === backdrop) closeAssignSheet(); };
    const sheet = document.createElement('div');
    sheet.className = 'assign-sheet';
    backdrop.appendChild(sheet);

    function paint(){
      sheet.innerHTML = '';
      const h = document.createElement('h3');
      h.textContent = (side === 'defense' ? (DEF_ROLE_NAMES[slot]||slot) : (ROLE_NAMES[slot]||slot));
      sheet.appendChild(h);

      if (side === 'defense'){
        renderSheetRoster(sheet, slot, DEF_ASSIGNMENTS, ()=>{});
        const currentVal = customDefense.paths[slot] || 'stay';
        renderSheetOptionGroups(sheet, DEF_PATHS[currentVal].label,
          [{label:'Action:', options: DEF_PATH_ORDER.map(k=>({value:k,label:DEF_PATHS[k].label}))}],
          currentVal,
          (val)=>{ customDefense.paths[slot] = val; });
      } else if (currentPlay === 'customRun'){
        renderSheetRoster(sheet, slot, ASSIGNMENTS, ()=>{});
        if (slot === 'QB'){
          const currentVal = customRun.qbAction;
          renderSheetOptionGroups(sheet, QB_ACTION_LABELS[currentVal],
            [{label:'QB Action:', options: Object.keys(QB_ACTION_LABELS).map(k=>({value:k,label:QB_ACTION_LABELS[k]}))}],
            currentVal,
            (val)=>{ customRun.qbAction = val; });
        } else {
          const currentVal = customRun.paths[slot] || 'stay';
          renderSheetOptionGroups(sheet, pathDefFor(currentVal).label,
            [{label:'Run:', options: RUN_PATH_ORDER.map(k=>({value:k,label:RUN_PATHS[k].label}))},
             {label:'Pass:', options: ROUTE_ORDER.map(k=>({value:k,label:ROUTES[k].label}))}],
            currentVal,
            (val)=>{ customRun.paths[slot] = val; });
          renderSheetBallToggle(sheet, ()=> customRun.goesTo === slot, ()=>{ customRun.goesTo = slot; });
        }
      } else {
        // customPass
        renderSheetRoster(sheet, slot, ASSIGNMENTS, ()=>{});
        if (slot === 'QB'){
          const p = document.createElement('p'); p.className = 'assign-current';
          p.textContent = 'Drops back and reads the field — nothing to assign here.';
          sheet.appendChild(p);
        } else {
          const currentVal = customPass.routes[slot] || 'stay';
          renderSheetOptionGroups(sheet, ROUTES[currentVal].label,
            [{label:'Route:', options: ROUTE_ORDER.map(k=>({value:k,label:ROUTES[k].label}))}],
            currentVal,
            (val)=>{ customPass.routes[slot] = val; });
          renderSheetBallToggle(sheet, ()=> customPass.target === slot, ()=>{ customPass.target = slot; });
        }
      }

      const doneBtn = document.createElement('button');
      doneBtn.className = 'assign-sheet-close'; doneBtn.textContent = 'Done';
      doneBtn.onclick = closeAssignSheet;
      sheet.appendChild(doneBtn);
    }

    currentSheetRender = paint;
    paint();
    root.innerHTML = '';
    root.appendChild(backdrop);
  }

  // ---------- init ----------
  drawField();
  buildLayers();
  buildTabs();
  setPlay('slantFlat');
  setDefense('cover2');
  setMode('offense');

  // ---------- offline caching ----------
  // Registers a service worker so, after the first successful load,
  // the page keeps working with no wifi/signal (e.g. at practice).
  if ('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('./sw.js').catch(()=>{
        // Fails silently if served from file:// or an unsupported context —
        // the page still works fine online, it just won't cache itself.
      });
    });
  }
})();
</script>
</body>
</html>
