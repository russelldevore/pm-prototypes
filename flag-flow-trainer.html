  function getPosAtT(waypoints, t){
    if (t <= waypoints[0].t) return {x:waypoints[0].x, y:waypoints[0].y};
    const last = waypoints[waypoints.length-1];
    if (t >= last.t) return {x:last.x, y:last.y};
    for (let i=0;i<waypoints.length-1;i++){
      const a = waypoints[i], b = waypoints[i+1];
      if (t >= a.t && t <= b.t){
        const span = (b.t - a.t) || 1;
        const local = (t - a.t) / span;
        return { x: a.x + (b.x-a.x)*local, y: a.y + (b.y-a.y)*local };
      }
    }
    return {x:last.x, y:last.y};
  }

    return e;
  }

  // ---------- yard scale ----------
  // LOS_X is the pixel x-position of the line of scrimmage; YARD_PX is
  // pixels per yard. Field runs 0–50 yards, LOS fixed at the 20.
  const LOS_X = 330;
  const YARD_PX = 14;
  const FIELD_LEFT = 50; // pixel x of the 0-yard line

  // ---------- static field ----------
  function drawField(){
    svg.innerHTML = '';
    const left = 50, right = 750, top = 50, bottom = 450;

    // alternating 5-yard backdrop stripes
    for (let i=0; i<(right-left)/(5*YARD_PX); i++){
      const x = left + i*5*YARD_PX;
      svg.appendChild(el('rect',{x:x,y:top,width:5*YARD_PX,height:bottom-top,
        fill: i%2===0 ? 'rgba(255,255,255,0.02)' : 'rgba(0,0,0,0.05)'}));
    }
    // sidelines
    svg.appendChild(el('rect',{x:left,y:top,width:right-left,height:bottom-top,fill:'none',stroke:'var(--line-white)','stroke-width':2}));

    // minor 1-yard ticks
    for (let x = left; x <= right; x += YARD_PX){
      const yard = Math.round((x - FIELD_LEFT) / YARD_PX);
      if (yard % 5 === 0) continue; // majors drawn separately below
      svg.appendChild(el('line',{x1:x,y1:top,x2:x,y2:bottom,stroke:'var(--line-white)','stroke-width':0.5,opacity:0.22}));
    }
    // major 5-yard lines, labeled with the real field number (0–50)
    for (let x = left; x <= right; x += YARD_PX){
      const yard = Math.round((x - FIELD_LEFT) / YARD_PX);
      if (yard % 5 !== 0 || x === LOS_X) continue;
      svg.appendChild(el('line',{x1:x,y1:top,x2:x,y2:bottom,stroke:'var(--line-white)','stroke-width':1,opacity:0.5}));
      const lbl = svg.appendChild(el('text',{x:x,y:40,fill:'var(--chalk-dim)','font-size':11,'text-anchor':'middle',
        'font-family':'-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif'}));
      lbl.textContent = String(yard);
    }

    // line of scrimmage (fixed at the 20)
    svg.appendChild(el('line',{x1:LOS_X,y1:top,x2:LOS_X,y2:bottom,stroke:'var(--flag-gold)','stroke-width':2,'stroke-dasharray':'6,4','opacity':0.8}));
    svg.appendChild(el('text',{x:LOS_X,y:40,fill:'var(--flag-gold)','font-size':12,'text-anchor':'middle','font-family':'Bradley Hand, Segoe Print, Chalkboard SE, Comic Sans MS, cursive'})).textContent = 'LOS · 20';
    // no-rush arc (5 yd) — decorative
    svg.appendChild(el('path',{d:`M ${LOS_X} ${top} A ${5*YARD_PX} ${5*YARD_PX} 0 0 0 ${LOS_X} ${bottom}`,
      fill:'none', stroke:'var(--line-white)','stroke-width':1,'stroke-dasharray':'3,4'}));
  }

  // ---------- route preview layer ----------
  let routeLayer, playerLayer, ballLayer, readLayer;

  function buildLayers(){
    routeLayer = el('g',{id:'routes'}); svg.appendChild(routeLayer);
    readLayer  = el('g',{id:'reads'});  svg.appendChild(readLayer);
    ballLayer  = el('g',{id:'ball'});   svg.appendChild(ballLayer);
    playerLayer= el('g',{id:'players'});svg.appendChild(playerLayer);
  }

  function drawRoutePreviews(){
    routeLayer.innerHTML = '';
    const play = PLAYS[currentPlay];
    const def = DEFENSES[currentDefense];
    Object.keys(play.routes).forEach(key=>{
      if (key === 'QB') return; // don't show QB drop as a "route"
      const p = el('path',{d:pathFromWaypoints(play.routes[key]), fill:'none',
        stroke:'var(--off-red)','stroke-width':2,'stroke-dasharray':'5,5','opacity':0.35});
      routeLayer.appendChild(p);
    });
    Object.keys(def.routes).forEach(key=>{
      const p = el('path',{d:pathFromWaypoints(def.routes[key]), fill:'none',
        stroke:'var(--def-blue)','stroke-width':2,'stroke-dasharray':'2,5','opacity':0.3});
      routeLayer.appendChild(p);
    });
  }

  const OFF_LABELS = {QB:'QB', C:'C', WR_L:'X', WR_S:'Z', WR_R:'Y', WR:'X', RB_L:'RB', RB_R:'RB', RB:'RB'};
  const DEF_LABELS = {CB_L:'C', CB_R:'C', NB:'N', S1:'S', S2:'S', RUSH:'R', FS:'F'};

  // ---------- roster & lineup assignment ----------
  // Static roster — edit this list directly to match your team.
  const ROSTER = []; // roster no longer hardcoded — entered per device

  // Friendly role names shown next to each dropdown. Falls back to the
  // raw key (e.g. "WR_L") for anything not listed here.
  const ROLE_NAMES = {
    QB:'QB', C:'Center', WR:'WR', WR_L:'WR (L)', WR_R:'WR (R)', WR_S:'Slot',
    RB:'RB', RB_L:'RB (L)', RB_R:'RB (R)'
  };

  // Shared across plays so a player assigned to QB stays the QB no matter
  // which play is selected — keyed by role, e.g. { QB: 'Jake', C: 'Sam' }.
  const ASSIGNMENTS = {};

  function buildLineupPanel(){
    const panel = document.getElementById('lineupPanel');
    panel.innerHTML = '';
    const play = PLAYS[currentPlay];
    Object.keys(play.routes).forEach(key=>{
      const chip = document.createElement('div');
      chip.className = 'lineup-chip';
      const role = document.createElement('span');
      role.className = 'role';
      role.textContent = ROLE_NAMES[key] || key;
      const select = document.createElement('select');
      const blank = document.createElement('option');
      blank.value = ''; blank.textContent = '—';
      select.appendChild(blank);
      ROSTER.forEach(name=>{
        const opt = document.createElement('option');
        opt.value = name; opt.textContent = name;
        if (ASSIGNMENTS[key] === name) opt.selected = true;
        select.appendChild(opt);
      });
      select.onchange = ()=>{
        if (select.value) ASSIGNMENTS[key] = select.value;
        else delete ASSIGNMENTS[key];
        render();
      };
      chip.appendChild(role);
      chip.appendChild(select);
      panel.appendChild(chip);
    });
  }

  function drawPlayers(){
    playerLayer.innerHTML = '';
    const play = PLAYS[currentPlay];
    const def = DEFENSES[currentDefense];

    Object.keys(play.routes).forEach(key=>{
      const pos = getPosAtT(play.routes[key], t);
      const g = el('g',{});
      g.appendChild(el('circle',{cx:pos.x, cy:pos.y, r:20, fill:'var(--off-red)', stroke:'#2a0a08','stroke-width':1.5}));
      const assigned = ASSIGNMENTS[key];
      const label = assigned ? (assigned.length > 6 ? assigned.slice(0,6) : assigned) : (OFF_LABELS[key] || key);
      const txt = el('text',{x:pos.x, y:pos.y+4, 'text-anchor':'middle',
        'font-size': assigned ? 10.5 : 14, 'font-weight':700, fill:'#fff',
        'font-family':'-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif'});
      txt.textContent = label;
      g.appendChild(txt);
      playerLayer.appendChild(g);
    });

    Object.keys(def.routes).forEach(key=>{
      const pos = getPosAtT(def.routes[key], t);
      const g = el('g',{});
      g.appendChild(el('circle',{cx:pos.x, cy:pos.y, r:18, fill:'none', stroke:'var(--def-blue)','stroke-width':3}));
      const txt = el('text',{x:pos.x, y:pos.y+5, 'text-anchor':'middle','font-size':13,'font-weight':700,fill:'var(--def-blue)','font-family':'-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif'});
      txt.textContent = DEF_LABELS[key] || key;
      g.appendChild(txt);
      playerLayer.appendChild(g);
    });
  }

  function drawBall(){
    ballLayer.innerHTML = '';
    const play = PLAYS[currentPlay];
    const th = play.throw;
    if (!th) return;
    if (t < th.t0){
      // ball with QB
      const qbPos = getPosAtT(play.routes.QB, t);
      ballLayer.appendChild(el('circle',{cx:qbPos.x+10, cy:qbPos.y, r:4, fill:'var(--flag-gold)'}));
    } else if (t <= th.t1){
      const local = (t - th.t0) / (th.t1 - th.t0 || 1);
      const fromPos = getPosAtT(play.routes[th.from], th.t0);
      const toPos = getPosAtT(play.routes[th.to], th.t1);
      const arc = th.type === 'handoff' ? 0 : 30; // handoffs travel flat, passes arc
      const bx = fromPos.x + (toPos.x - fromPos.x) * local;
      const by = fromPos.y + (toPos.y - fromPos.y) * local - Math.sin(local*Math.PI)*arc;
      ballLayer.appendChild(el('circle',{cx:bx, cy:by, r:5, fill:'var(--flag-gold)', stroke:'#7a5c12','stroke-width':1}));
    } else {
      const pos = getPosAtT(play.routes[th.to], t);
      ballLayer.appendChild(el('circle',{cx:pos.x-16, cy:pos.y, r:4, fill:'var(--flag-gold)'}));
    }
  }

  function drawReadBadge(){
    readLayer.innerHTML = '';
    const play = PLAYS[currentPlay];
    let active = null;
    for (const r of play.reads){
      if (t >= r.t) active = r;
    }
    if (!active) return;
    const pos = getPosAtT(play.routes[active.target], Math.max(t, active.t));
    const label = active.label;
    const w = Math.max(70, label.length*6.2);
    const g = el('g',{opacity:0.95});
    g.appendChild(el('rect',{x:pos.x-w/2, y:pos.y-38, width:w, height:20, rx:10,
      fill:'rgba(227,178,60,0.15)', stroke:'var(--flag-gold)','stroke-width':1}));
    const txt = el('text',{x:pos.x, y:pos.y-24, 'text-anchor':'middle','font-size':10.5,
      'font-family':'Bradley Hand, Segoe Print, Chalkboard SE, Comic Sans MS, cursive', fill:'var(--flag-gold)'});
    txt.textContent = label;
    g.appendChild(txt);
    readLayer.appendChild(g);
  }

  function updatePhaseBadge(){
    const play = PLAYS[currentPlay];
    const badge = document.getElementById('phaseBadge');
    if (t <= 0.02) { badge.textContent = 'Pre-snap'; return; }
    if (t >= 0.98) { badge.textContent = 'Play over'; return; }
    let active = null;
    for (const r of play.reads){ if (t >= r.t) active = r; }
    const th = play.throw;
    const isHandoff = th && th.type === 'handoff';
    if (th && t >= th.t0 && t <= th.t1){ badge.textContent = isHandoff ? 'Handoff' : 'Ball in the air'; return; }
    if (th && t > th.t1){ badge.textContent = isHandoff ? 'Ball carrier running' : 'Yards after catch'; return; }
    badge.textContent = active ? active.label : 'Snap!';
  }

  function render(){
    drawPlayers();
    drawBall();
    drawReadBadge();
    updatePhaseBadge();
    document.getElementById('scrub').value = Math.round(t*1000);
  }

  function setPlay(key){
    currentPlay = key;
    t = 0; playing = false;
    document.getElementById('playBtn').textContent = '▶';
    document.getElementById('playDesc').innerHTML = PLAYS[key].desc;
    document.querySelectorAll('#playTabs .tab').forEach(b=> b.classList.toggle('active', b.dataset.key===key));
    drawRoutePreviews();
    buildLineupPanel();
    render();
  }

  function setDefense(key){
    currentDefense = key;
    document.querySelectorAll('#defenseTabs .tab').forEach(b=> b.classList.toggle('active', b.dataset.key===key));
    drawRoutePreviews();
    render();
  }

  function buildTabs(){
    const playTabs = document.getElementById('playTabs');
    Object.keys(PLAYS).forEach(key=>{
      const b = document.createElement('button');
      b.className = 'tab'; b.textContent = PLAYS[key].name; b.dataset.key = key;
      b.onclick = ()=> setPlay(key);
      playTabs.appendChild(b);
    });
    const defTabs = document.getElementById('defenseTabs');
    Object.keys(DEFENSES).forEach(key=>{
      const b = document.createElement('button');
      b.className = 'tab'; b.textContent = DEFENSES[key].name; b.dataset.key = key;
      b.onclick = ()=> setDefense(key);
      defTabs.appendChild(b);
    });
  }

  // ---------- playback loop ----------
  function tick(ts){
    if (!playing) { lastTs = null; return; }
    if (lastTs === null) lastTs = ts;
    const dt = (ts - lastTs) / 1000;
    lastTs = ts;
    t += dt * speed;
    if (t >= 1){ t = 1; playing = false; document.getElementById('playBtn').textContent = '▶'; }
    render();
    if (playing) requestAnimationFrame(tick);
  }

  document.getElementById('playBtn').onclick = ()=>{
    if (t >= 1) t = 0;
    playing = !playing;
    document.getElementById('playBtn').textContent = playing ? '❚❚' : '▶';
    if (playing){ lastTs = null; requestAnimationFrame(tick); }
  };
  document.getElementById('resetBtn').onclick = ()=>{
    t = 0; playing = false; document.getElementById('playBtn').textContent = '▶'; render();
  };
  document.getElementById('stepFwdBtn').onclick = ()=>{
    playing = false; document.getElementById('playBtn').textContent = '▶';
    t = Math.min(1, t + 0.08); render();
  };
  document.getElementById('stepBackBtn').onclick = ()=>{
    playing = false; document.getElementById('playBtn').textContent = '▶';
    t = Math.max(0, t - 0.08); render();
  };
  document.getElementById('scrub').oninput = (e)=>{
    playing = false; document.getElementById('playBtn').textContent = '▶';
    t = Number(e.target.value) / 1000; render();
  };
  document.getElementById('speedSelect').onchange = (e)=>{
    speed = Number(e.target.value);
  };

  // ---------- init ----------
  drawField();
  buildLayers();
  buildTabs();
  setPlay('slantFlat');
  setDefense('cover2');

  // ---------- offline caching ----------
  // Registers a service worker so, after the first successful load,
  // the page keeps working with no wifi/signal (e.g. at practice).
  if ('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('./sw.js').catch(()=>{
        // Fails silently if served from file:// or an unsupported context —
        // the page still works fine online, it just won't cache itself.
      });
    });
  }
})();
</script>
</body>
</html>
