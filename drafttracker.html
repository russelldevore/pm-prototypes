<title>Draft Room</title>
<!--
  Works two ways:

  1. OFFLINE / LOCAL ONLY — just open this file. Uses only system-installed
     fonts and browser localStorage, no network required at all. Picks stay
     on this one device/browser.

  2. LIVE-SYNCED — this file also tries to load the Supabase client below
     and, if SUPABASE_URL/SUPABASE_ANON_KEY are filled in further down in
     the <script>, syncs every pick in real time to anyone else with the
     same page + the same "room code" (see the Team Setup panel in-app).
     If that script fails to load or Supabase is unreachable, the app
     quietly falls back to mode 1 with zero errors — nothing breaks.

  Font note: if you want the condensed "scoreboard" display face and Work
  Sans body face exactly as originally designed, add this once you're
  online (this one line does need network):

  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

  ...and prepend "Big Shoulders Display", "Work Sans", "IBM Plex Mono" back
  onto the three --font-* variables below.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #eef2f1;
    --surface: #ffffff;
    --surface-2: #e3e9e7;
    --surface-3: #d6ded9;
    --border: #c7d1cc;
    --text: #16211e;
    --text-dim: #55635d;
    --text-faint: #8b968f;
    --accent: #a86518;
    --accent-ink: #fffaf2;
    --accent-soft: #a8651822;
    --good: #276b45;
    --good-soft: #276b4517;
    --danger: #a8402b;
    --danger-soft: #a8402b17;
    --pos-qb: #6a4fb0;
    --pos-rb: #1f7a6c;
    --pos-wr: #2c66ad;
    --pos-te: #a05a1e;
    --pos-k: #5c6b70;
    --pos-def: #963f34;
    --radius: 10px;
    --font-display: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", ui-sans-serif, Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Consolas, "Liberation Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10161a;
      --surface: #171f24;
      --surface-2: #1e282e;
      --surface-3: #263136;
      --border: #303c42;
      --text: #e9eef0;
      --text-dim: #9caab0;
      --text-faint: #647177;
      --accent: #e2a13d;
      --accent-ink: #1a1206;
      --accent-soft: #e2a13d22;
      --good: #5fbf8a;
      --good-soft: #5fbf8a1c;
      --danger: #e2685a;
      --danger-soft: #e2685a1c;
      --pos-qb: #a591e0;
      --pos-rb: #5fc4b0;
      --pos-wr: #7cabe8;
      --pos-te: #e0a465;
      --pos-k: #9fadb2;
      --pos-def: #e08a7c;
    }
  }

  :root[data-theme="dark"] {
    --bg: #10161a;
    --surface: #171f24;
    --surface-2: #1e282e;
    --surface-3: #263136;
    --border: #303c42;
    --text: #e9eef0;
    --text-dim: #9caab0;
    --text-faint: #647177;
    --accent: #e2a13d;
    --accent-ink: #1a1206;
    --accent-soft: #e2a13d22;
    --good: #5fbf8a;
    --good-soft: #5fbf8a1c;
    --danger: #e2685a;
    --danger-soft: #e2685a1c;
    --pos-qb: #a591e0;
    --pos-rb: #5fc4b0;
    --pos-wr: #7cabe8;
    --pos-te: #e0a465;
    --pos-k: #9fadb2;
    --pos-def: #e08a7c;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  button { font-family: inherit; }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--text-faint);
    font-weight: 500;
  }

  /* ---------- Header ---------- */
  header.topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
  }
  .topbar-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-right: auto;
  }
  .brand-mark {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 24px;
    letter-spacing: 0.01em;
    line-height: 1;
  }
  .brand-sub {
    font-size: 12px;
    color: var(--text-faint);
    font-family: var(--font-mono);
  }

  .sync-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); flex-shrink: 0; }
  .sync-badge.live { color: var(--good); border-color: transparent; background: var(--good-soft); }
  .sync-badge.live .sync-dot { background: var(--good); }
  @media (prefers-reduced-motion: no-preference) {
    .sync-badge.connecting .sync-dot { animation: pulse-dot 1s ease-in-out infinite; }
  }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .sync-badge.error { color: var(--danger); border-color: transparent; background: var(--danger-soft); }
  .sync-badge.error .sync-dot { background: var(--danger); }

  .clock {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 14px 6px 6px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
  }
  .clock.mine {
    background: var(--accent-soft);
    border-color: var(--accent);
  }
  .clock-num {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 800;
    background: var(--surface-3);
    color: var(--text);
    border-radius: 999px;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .clock.mine .clock-num {
    background: var(--accent);
    color: var(--accent-ink);
  }
  @media (prefers-reduced-motion: no-preference) {
    .clock.mine .clock-num { animation: pulse 1.8s ease-in-out infinite; }
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 var(--accent-soft); }
    50% { box-shadow: 0 0 0 6px transparent; }
  }
  .clock-text { display: flex; flex-direction: column; line-height: 1.25; }
  .clock-team { font-weight: 700; font-size: 15px; }
  .clock-meta { font-size: 12px; color: var(--text-dim); font-family: var(--font-mono); }

  .snake-strip { display: flex; gap: 4px; align-items: center; }
  .snake-dot {
    width: 22px; height: 22px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 10px; font-weight: 600;
    background: var(--surface-2); color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .snake-dot.done { background: var(--surface-3); color: var(--text-faint); }
  .snake-dot.current { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .snake-dot.you { box-shadow: inset 0 0 0 1.5px var(--good); }

  .topbar-actions { display: flex; gap: 8px; align-items: center; }

  .btn {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
    transition: background 0.12s ease, border-color 0.12s ease;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface-3); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.ghost { background: transparent; }
  .btn.small { padding: 4px 9px; font-size: 12px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .progress-rail {
    max-width: 1400px;
    margin: 0 auto;
    height: 3px;
    background: var(--surface-2);
    margin-top: 10px;
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; background: var(--accent); }

  /* ---------- Layout ---------- */
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr) 300px;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 980px) {
    main { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    gap: 8px;
  }
  .panel-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 0.01em;
  }

  /* ---------- Suggestion panel ---------- */
  .suggest-card {
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 14px;
  }
  .suggest-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); font-weight: 700; font-family: var(--font-mono); }
  .suggest-name { font-family: var(--font-display); font-weight: 800; font-size: 24px; margin-top: 4px; line-height: 1.05; }
  .suggest-meta { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
  .suggest-why { font-size: 12.5px; color: var(--text-dim); margin-top: 8px; line-height: 1.4; }
  .suggest-card .btn { margin-top: 10px; width: 100%; }

  .need-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .need-chip {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .need-chip.open { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
  .need-chip.filled { background: var(--good-soft); color: var(--good); border-color: transparent; }

  .best-avail-list { display: flex; flex-direction: column; gap: 0; margin-top: 4px; }
  .best-row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .best-row:last-child { border-bottom: none; }
  .rank-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    width: 22px;
    flex-shrink: 0;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .pos-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 5px;
    border-radius: 4px;
    color: white;
    flex-shrink: 0;
    letter-spacing: 0.02em;
  }
  .best-row .name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .best-row .nfl { color: var(--text-faint); font-size: 11px; font-family: var(--font-mono); }

  /* ---------- Pool panel ---------- */
  .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .search-row input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
  }
  .search-row input[type="text"]:focus { background: var(--surface); }
  .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip {
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-dim);
    cursor: pointer;
  }
  .chip.active { background: var(--text); color: var(--surface); border-color: var(--text); }

  .pool-table { width: 100%; border-collapse: collapse; }
  .pool-table thead th {
    text-align: left;
    font-family: var(--font-mono);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    font-weight: 600;
    padding: 0 8px 8px;
    border-bottom: 1px solid var(--border);
  }
  .pool-table tbody td {
    padding: 8px;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px;
    vertical-align: middle;
  }
  .pool-table tbody tr:hover { background: var(--surface-2); }
  .pool-table .rank-cell { font-family: var(--font-mono); color: var(--text-faint); font-variant-numeric: tabular-nums; width: 34px; }
  .pool-table .name-cell { font-weight: 600; }
  .pool-table .nfl-cell { color: var(--text-faint); font-family: var(--font-mono); font-size: 12px; }
  .pool-table .action-cell { text-align: right; }
  .pool-empty { padding: 30px 10px; text-align: center; color: var(--text-faint); font-size: 13px; }
  .pool-scroll { max-height: 620px; overflow-y: auto; }

  /* ---------- Roster panel ---------- */
  .slot-row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
  }
  .slot-row:last-child { border-bottom: none; }
  .slot-label {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--text-faint);
    width: 34px;
    flex-shrink: 0;
  }
  .slot-player { flex: 1; min-width: 0; }
  .slot-player .name { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot-player .meta { font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); }
  .slot-open { color: var(--text-faint); font-size: 13px; font-style: italic; }
  .bench-heading { margin-top: 14px; margin-bottom: 2px; }

  .team-name-input {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    color: var(--text);
    padding: 1px 2px;
    width: 100%;
  }
  .team-name-input:hover, .team-name-input:focus { border-bottom-color: var(--border); }

  /* ---------- Board panel ---------- */
  .board-panel { grid-column: 1 / -1; }
  .board-scroll { overflow-x: auto; }
  table.board { border-collapse: collapse; width: 100%; min-width: 920px; }
  table.board th {
    font-family: var(--font-body);
    font-size: 12.5px;
    font-weight: 700;
    padding: 6px 4px;
    text-align: center;
    border-bottom: 2px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--surface);
  }
  table.board th.you-col { color: var(--good); }
  table.board td {
    border: 1px solid var(--border);
    padding: 0;
    width: 12.5%;
  }
  .board-round-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-faint);
    text-align: right;
    padding-right: 6px;
    white-space: nowrap;
    border: none !important;
  }
  .board-cell {
    display: block;
    width: 100%;
    padding: 6px 7px;
    min-height: 44px;
    background: none;
    border: none;
    text-align: left;
    cursor: pointer;
    font-family: var(--font-body);
    color: var(--text);
  }
  .board-cell:hover { background: var(--surface-2); }
  .board-cell.filled .bp-name { font-weight: 600; font-size: 12px; display: block; line-height: 1.25; }
  .board-cell.filled .bp-meta { font-size: 10px; color: var(--text-faint); font-family: var(--font-mono); }
  .board-cell.empty .bp-num { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
  .board-cell.current { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
  .board-cell.you-col { background: var(--good-soft); }
  .board-cell.you-col.current { background: var(--accent-soft); }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(10, 14, 12, 0.55);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 8vh 16px; z-index: 100;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    width: 100%; max-width: 460px; padding: 18px; max-height: 78vh; display: flex; flex-direction: column;
  }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .modal-title { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
  .modal-current { background: var(--surface-2); border-radius: 8px; padding: 10px; margin-bottom: 10px; font-size: 13.5px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .modal-list { overflow-y: auto; }

  .empty-note { color: var(--text-faint); font-size: 12.5px; padding: 10px 0; }
  a { color: inherit; }
</style>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">Draft Room</span>
      <span class="brand-sub">8-TEAM · STANDARD · SNAKE</span>
      <span class="sync-badge" id="syncBadge" title="Draft room code"><span class="sync-dot"></span><span id="syncText">Local only</span></span>
    </div>

    <div class="clock" id="clockBox">
      <div class="clock-num" id="clockRound">1</div>
      <div class="clock-text">
        <span class="clock-team" id="clockTeam">—</span>
        <span class="clock-meta" id="clockMeta">—</span>
      </div>
    </div>

    <div class="snake-strip" id="snakeStrip"></div>

    <div class="topbar-actions">
      <button class="btn ghost small" id="teamSetupBtn">Team setup</button>
      <button class="btn ghost small" id="undoBtn">Undo last pick</button>
      <button class="btn ghost small" id="resetBtn">Reset draft</button>
    </div>
  </div>
  <div class="progress-rail"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
</header>

<main>
  <!-- Suggested pick panel -->
  <section class="panel" id="suggestPanel">
    <div class="panel-head">
      <span class="panel-title">Your Pick</span>
    </div>
    <div id="suggestArea"></div>

    <div class="eyebrow" style="margin-top:16px;">Starter needs</div>
    <div class="need-row" id="needRow"></div>

    <div class="eyebrow" style="margin-top:16px;">Best available</div>
    <div class="best-avail-list" id="bestAvailList"></div>
  </section>

  <!-- Player pool -->
  <section class="panel">
    <div class="panel-head">
      <span class="panel-title">Available Players</span>
      <span class="eyebrow" id="poolCount"></span>
    </div>
    <div class="search-row">
      <input type="text" id="searchBox" placeholder="Type a name and press Enter to draft it to the current pick…" autocomplete="off">
    </div>
    <div class="filter-chips" id="filterChips"></div>
    <div class="pool-scroll">
      <table class="pool-table">
        <thead>
          <tr><th style="width:34px;">#</th><th>Player</th><th style="width:70px;">Pos</th><th style="width:50px;">Team</th><th style="width:70px;"></th></tr>
        </thead>
        <tbody id="poolBody"></tbody>
      </table>
      <div class="pool-empty" id="poolEmptyMsg" style="display:none;">No players match.</div>
    </div>
  </section>

  <!-- Your roster -->
  <section class="panel">
    <div class="panel-head">
      <span class="panel-title">Your Roster</span>
    </div>
    <div id="rosterStarters"></div>
    <div class="eyebrow bench-heading">Bench</div>
    <div id="rosterBench"></div>
  </section>

  <!-- Draft board -->
  <section class="panel board-panel">
    <div class="panel-head">
      <span class="panel-title">Draft Board</span>
      <span class="eyebrow">Click any pick to fill it, fix it, or clear it</span>
    </div>
    <div class="board-scroll">
      <table class="board" id="boardTable"></table>
    </div>
  </section>
</main>

<div id="modalRoot"></div>

<script>
(function () {

    text.textContent = labels[syncStatus] || "Local only";
    badge.title = syncStatus === "error" && lastSyncError ? lastSyncError : ("Draft room code: " + roomCode);
  }

  function initSupabaseClient() {
    try {
      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return null;
      if (typeof window.supabase === "undefined" || !window.supabase.createClient) return null;
      // This app never signs in — it only uses the anon/publishable key for
      // table + Realtime access — so the auth session/multi-tab-lock
      // machinery is turned off. Besides being unnecessary, that machinery
      // is also what throws "DataCloneError: Headers object could not be
      // cloned" when this file is opened directly from disk (file:// pages
      // have a "null" origin, which breaks its cross-tab postMessage code).
      return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
      });
    } catch (e) {
      return null;
    }
  }

  function connectSupabase() {
    sbClient = initSupabaseClient();
    if (!sbClient) { setSyncStatus("local"); return; }
    setSyncStatus("connecting");
    loadRemoteState()
      .then(function () {
        subscribeRealtime();
        render();
      })
      .catch(function (err) {
        noteSyncError("Loading draft from Supabase failed", err);
      });
  }

  function loadRemoteState() {
    return Promise.all([
      sbClient.from("picks").select("overall,player_id").eq("draft_id", roomCode),
      sbClient.from("teams").select("slot,name").eq("draft_id", roomCode)
    ]).then(function (results) {
      var picksRes = results[0], teamsRes = results[1];
      if (picksRes.error) throw picksRes.error;
      if (teamsRes.error) throw teamsRes.error;
      state.picks = new Array(TOTAL_PICKS).fill(null);
      (picksRes.data || []).forEach(function (row) {
        if (row.overall >= 1 && row.overall <= TOTAL_PICKS) state.picks[row.overall - 1] = row.player_id;
      });
      state.teamNames = ["You", "Team 2", "Team 3", "Team 4", "Team 5", "Team 6", "Team 7", "Team 8"];
      (teamsRes.data || []).forEach(function (row) {
        if (row.slot >= 1 && row.slot <= NUM_TEAMS) state.teamNames[row.slot - 1] = row.name;
      });
      saveState();
    });
  }

  function subscribeRealtime() {
    if (realtimeChannel && sbClient) {
      try { sbClient.removeChannel(realtimeChannel); } catch (e) { /* ignore */ }
      realtimeChannel = null;
    }
    realtimeChannel = sbClient
      .channel("room-" + roomCode)
      .on("postgres_changes", { event: "*", schema: "public", table: "picks", filter: "draft_id=eq." + roomCode }, handleRemotePickChange)
      .on("postgres_changes", { event: "*", schema: "public", table: "teams", filter: "draft_id=eq." + roomCode }, handleRemoteTeamChange)
      .subscribe(function (status, err) {
        if (status === "SUBSCRIBED") setSyncStatus("live");
        else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") noteSyncError("Realtime subscription failed (" + status + ")", err);
      });
  }

  function handleRemotePickChange(payload) {
    if (payload.eventType === "DELETE") {
      var ov = payload.old && payload.old.overall;
      if (ov) state.picks[ov - 1] = null;
    } else {
      var row = payload.new;
      if (row && row.overall >= 1 && row.overall <= TOTAL_PICKS) state.picks[row.overall - 1] = row.player_id;
    }
    saveState();
    render();
  }

  function handleRemoteTeamChange(payload) {
    if (payload.eventType === "DELETE") {
      var slot = payload.old && payload.old.slot;
      if (slot) state.teamNames[slot - 1] = "Team " + slot;
    } else {
      var row = payload.new;
      if (row && row.slot >= 1 && row.slot <= NUM_TEAMS) state.teamNames[row.slot - 1] = row.name;
    }
    saveState();
    render();
  }

  function pushPick(overall, playerId) {
    if (!sbClient) return;
    var player = PLAYERS_BY_ID[playerId];
    var row = { draft_id: roomCode, overall: overall, player_id: playerId };
    // Denormalized for readability in the Supabase table editor — the app
    // itself never reads these back, it still resolves player_id locally.
    if (player) { row.player_name = player.name; row.player_pos = player.pos; row.player_team = player.team; }
    sbClient.from("picks").upsert(row, { onConflict: "draft_id,overall" })
      .then(function (res) { if (res && res.error) noteSyncError("Saving pick #" + overall + " failed", res.error); });
  }

  function pushClearPick(overall) {
    if (!sbClient) return;
    sbClient.from("picks").delete().match({ draft_id: roomCode, overall: overall })
      .then(function (res) { if (res && res.error) noteSyncError("Clearing pick #" + overall + " failed", res.error); });
  }

  function pushResetPicks() {
    if (!sbClient) return;
    sbClient.from("picks").delete().match({ draft_id: roomCode })
      .then(function (res) { if (res && res.error) noteSyncError("Resetting draft failed", res.error); });
  }

  function pushTeamName(slot, name) {
    if (!sbClient) return;
    sbClient.from("teams").upsert({ draft_id: roomCode, slot: slot, name: name }, { onConflict: "draft_id,slot" })
      .then(function (res) { if (res && res.error) noteSyncError("Saving team name failed", res.error); });
  }

  function switchRoom(newCodeRaw) {
    var newCode = sanitizeRoomCode(newCodeRaw);
    if (!newCode || newCode === roomCode) return;
    if (realtimeChannel && sbClient) {
      try { sbClient.removeChannel(realtimeChannel); } catch (e) { /* ignore */ }
      realtimeChannel = null;
    }
    applyRoomCode(newCode);
    state.picks = new Array(TOTAL_PICKS).fill(null);
    state.teamNames = ["You", "Team 2", "Team 3", "Team 4", "Team 5", "Team 6", "Team 7", "Team 8"];
    saveState();
    render();
    connectSupabase();
  }

  /* ================= Snake math ================= */
  // overall is 1-indexed
  function pickInfo(overall) {
    var round = Math.floor((overall - 1) / NUM_TEAMS) + 1;
    var posInRound = (overall - 1) % NUM_TEAMS;
    var team = (round % 2 === 1) ? (posInRound + 1) : (NUM_TEAMS - posInRound);
    return { round: round, team: team, pickInRound: posInRound + 1 };
  }

  function currentOverall() {
    for (var i = 0; i < TOTAL_PICKS; i++) {
      if (state.picks[i] === null) return i + 1;
    }
    return null; // draft complete
  }

  function draftedIdSet() {
    var s = new Set();
    state.picks.forEach(function (id) { if (id !== null) s.add(id); });
    return s;
  }

  function availablePlayers() {
    var drafted = draftedIdSet();
    return PLAYERS.filter(function (p) { return !drafted.has(p.id); });
  }

  /* ================= Roster derivation ================= */
  function getRosterForTeam(t) {
    var picksForTeam = [];
    for (var overall = 1; overall <= TOTAL_PICKS; overall++) {
      if (pickInfo(overall).team === t && state.picks[overall - 1] !== null) {
        picksForTeam.push({ overall: overall, playerId: state.picks[overall - 1] });
      }
    }
    var slotFilled = SLOT_DEFS.map(function () { return null; });
    var bench = [];
    picksForTeam.forEach(function (pk) {
      var player = PLAYERS_BY_ID[pk.playerId];
      if (!player) return;
      var idx = -1;
      for (var i = 0; i < SLOT_DEFS.length; i++) {
        if (SLOT_DEFS[i].pos === player.pos && slotFilled[i] === null) { idx = i; break; }
      }
      if (idx !== -1) {
        slotFilled[idx] = { player: player, overall: pk.overall };
      } else {
        bench.push({ player: player, overall: pk.overall });
      }
    });
    return { slotFilled: slotFilled, bench: bench, totalPicks: picksForTeam.length };
  }

  function suggestPick(t) {
    var roster = getRosterForTeam(t);
    var openPos = {};
    SLOT_DEFS.forEach(function (sd, i) {
      if (roster.slotFilled[i] === null) openPos[sd.pos] = (openPos[sd.pos] || 0) + 1;
    });
    var openList = Object.keys(openPos);
    var picksRemaining = ROUNDS - roster.totalPicks;
    var nonKD = openList.filter(function (p) { return p !== "K" && p !== "DEF"; });
    var targets;
    if (picksRemaining <= 2) {
      targets = openList;
    } else if (nonKD.length > 0) {
      targets = nonKD;
    } else {
      targets = openList;
    }
    var avail = availablePlayers();
    var pick = null;
    var reason = "";
    if (targets.length) {
      pick = avail.find(function (p) { return targets.indexOf(p.pos) !== -1; });
      if (pick) {
        reason = "Best available " + pick.pos + " — fills an open starter slot" + (nonKD.length === 0 && (pick.pos === "K" || pick.pos === "DEF") ? " (down to the final rounds)" : ".");
      }
    }
    if (!pick) {
      pick = avail[0];
      reason = pick ? "Starters are set — best player left on the board for your bench." : "";
    }
    return { pick: pick, reason: reason, openPos: openPos };
  }

  /* ================= Helpers ================= */
  function normalize(str) {
    return str.toLowerCase().replace(/[.'’]/g, "").replace(/\b(jr|sr|ii|iii|iv|v)\b/g, "").replace(/\s+/g, " ").trim();
  }

  function posColorVar(pos) {
    return "var(--pos-" + pos.toLowerCase() + ")";
  }

  function ordinalTeamLabel(t) {
    return state.teamNames[t - 1] || ("Team " + t);
  }

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  /* ================= Rendering ================= */
  var filterPos = "ALL";
  var searchTerm = "";

  function render() {
    renderClock();
    renderSnakeStrip();
    renderSuggestion();
    renderPool();
    renderRoster();
    renderBoard();
    var overall = currentOverall();
    var pct = overall === null ? 100 : Math.round(((overall - 1) / TOTAL_PICKS) * 100);
    document.getElementById("progressFill").style.width = pct + "%";
  }

  function renderClock() {
    var overall = currentOverall();
    var box = document.getElementById("clockBox");
    var roundEl = document.getElementById("clockRound");
    var teamEl = document.getElementById("clockTeam");
    var metaEl = document.getElementById("clockMeta");
    if (overall === null) {
      box.classList.remove("mine");
      roundEl.textContent = "✓";
      teamEl.textContent = "Draft complete";
      metaEl.textContent = TOTAL_PICKS + " picks made";
      return;
    }
    var info = pickInfo(overall);
    roundEl.textContent = info.round;
    var isYou = info.team === YOU_TEAM;
    box.classList.toggle("mine", isYou);
    teamEl.textContent = isYou ? "You're on the clock" : ordinalTeamLabel(info.team) + " is picking";
    metaEl.textContent = "Round " + info.round + ", Pick " + info.pickInRound + " · Overall #" + overall;

    if (!isYou) {
      var nextYou = null;
      for (var o = overall; o <= TOTAL_PICKS; o++) {
        if (pickInfo(o).team === YOU_TEAM && state.picks[o - 1] === null) { nextYou = o; break; }
      }
      if (nextYou !== null) {
        metaEl.textContent += " · " + (nextYou - overall) + " until you";
      }
    }
  }

  function renderSnakeStrip() {
    var overall = currentOverall();
    var info = overall === null ? null : pickInfo(overall);
    var wrap = document.getElementById("snakeStrip");
    wrap.innerHTML = "";
    for (var t = 1; t <= NUM_TEAMS; t++) {
      var dot = document.createElement("div");
      dot.className = "snake-dot";
      if (t === YOU_TEAM) dot.classList.add("you");
      if (info && info.team === t) dot.classList.add("current");
      dot.textContent = t;
      dot.title = ordinalTeamLabel(t);
      wrap.appendChild(dot);
    }
  }

  function renderSuggestion() {
    var overall = currentOverall();
    var area = document.getElementById("suggestArea");
    var s = suggestPick(YOU_TEAM);

    if (overall === null) {
      area.innerHTML = '<div class="empty-note">Draft is complete — nice work.</div>';
    } else if (!s.pick) {
      area.innerHTML = '<div class="empty-note">No players left in the pool.</div>';
    } else {
      var p = s.pick;
      var isYourTurn = pickInfo(overall).team === YOU_TEAM;
      var card = document.createElement("div");
      card.className = "suggest-card";
      card.innerHTML =
        '<div class="suggest-label">' + (isYourTurn ? "On the clock — suggested pick" : "If it were your pick right now") + '</div>' +
        '<div class="suggest-name">' + esc(p.name) + '</div>' +
        '<div class="suggest-meta">#' + p.rank + ' overall · <span class="pos-badge" style="background:' + posColorVar(p.pos) + '">' + p.pos + '</span> ' + p.team + '</div>' +
        '<div class="suggest-why">' + esc(s.reason) + '</div>';
      var btn = document.createElement("button");
      btn.className = "btn primary";
      btn.textContent = isYourTurn ? "Draft " + p.name : "Draft to current pick (" + ordinalTeamLabel(pickInfo(overall).team) + ")";
      btn.addEventListener("click", function () { assignPick(overall, p.id); });
      card.appendChild(btn);
      area.innerHTML = "";
      area.appendChild(card);
    }

    // Need row
    var needRow = document.getElementById("needRow");
    needRow.innerHTML = "";
    var roster = getRosterForTeam(YOU_TEAM);
    ROSTER_SLOTS.forEach(function (slotGroup) {
      var filledCount = 0, totalCount = 0;
      SLOT_DEFS.forEach(function (sd, i) {
        if (sd.pos === slotGroup.pos) {
          totalCount++;
          if (roster.slotFilled[i] !== null) filledCount++;
        }
      });
      var chip = document.createElement("span");
      chip.className = "need-chip " + (filledCount === totalCount ? "filled" : "open");
      chip.textContent = slotGroup.pos + " " + filledCount + "/" + totalCount;
      needRow.appendChild(chip);
    });

    // Best available (top 8 overall regardless of position)
    var listEl = document.getElementById("bestAvailList");
    listEl.innerHTML = "";
    var avail = availablePlayers().slice(0, 8);
    if (!avail.length) {
      listEl.innerHTML = '<div class="empty-note">Pool is empty.</div>';
    }
    avail.forEach(function (p) {
      var row = document.createElement("div");
      row.className = "best-row";
      row.innerHTML =
        '<span class="rank-badge">' + p.rank + '</span>' +
        '<span class="pos-badge" style="background:' + posColorVar(p.pos) + '">' + p.pos + '</span>' +
        '<span class="name">' + esc(p.name) + '</span>' +
        '<span class="nfl">' + p.team + '</span>';
      listEl.appendChild(row);
    });
  }

  function renderChips() {
    var wrap = document.getElementById("filterChips");
    wrap.innerHTML = "";
    var options = ["ALL"].concat(POS_ORDER);
    var avail = availablePlayers();
    options.forEach(function (opt) {
      var count = opt === "ALL" ? avail.length : avail.filter(function (p) { return p.pos === opt; }).length;
      var chip = document.createElement("button");
      chip.className = "chip" + (filterPos === opt ? " active" : "");
      chip.textContent = opt + " (" + count + ")";
      chip.addEventListener("click", function () { filterPos = opt; renderPool(); });
      wrap.appendChild(chip);
    });
  }

  function filteredPool() {
    var avail = availablePlayers();
    if (filterPos !== "ALL") avail = avail.filter(function (p) { return p.pos === filterPos; });
    if (searchTerm) {
      var n = normalize(searchTerm);
      avail = avail.filter(function (p) { return normalize(p.name).indexOf(n) !== -1; });
    }
    return avail;
  }

  function renderPool() {
    renderChips();
    var overall = currentOverall();
    var body = document.getElementById("poolBody");
    var pool = filteredPool();
    document.getElementById("poolCount").textContent = availablePlayers().length + " left";
    body.innerHTML = "";
    document.getElementById("poolEmptyMsg").style.display = pool.length ? "none" : "block";
    pool.slice(0, 300).forEach(function (p) {
      var tr = document.createElement("tr");
      tr.innerHTML =
        '<td class="rank-cell">' + p.rank + '</td>' +
        '<td class="name-cell">' + esc(p.name) + '</td>' +
        '<td><span class="pos-badge" style="background:' + posColorVar(p.pos) + '">' + p.pos + '</span></td>' +
        '<td class="nfl-cell">' + p.team + '</td>' +
        '<td class="action-cell"></td>';
      var btn = document.createElement("button");
      btn.className = "btn small primary";
      btn.textContent = "Draft";
      btn.disabled = overall === null;
      btn.addEventListener("click", function () { if (overall !== null) assignPick(overall, p.id); });
      tr.querySelector(".action-cell").appendChild(btn);
      body.appendChild(tr);
    });
  }

  function slotBlock(container, slotFilled) {
    container.innerHTML = "";
    SLOT_DEFS.forEach(function (sd, i) {
      var entry = slotFilled[i];
      var row = document.createElement("div");
      row.className = "slot-row";
      var label = document.createElement("span");
      label.className = "slot-label";
      label.textContent = sd.label;
      row.appendChild(label);
      var playerBox = document.createElement("div");
      playerBox.className = "slot-player";
      if (entry) {
        playerBox.innerHTML = '<div class="name">' + esc(entry.player.name) + '</div><div class="meta">' + entry.player.team + ' · Rd ' + pickInfo(entry.overall).round + '</div>';
      } else {
        playerBox.innerHTML = '<span class="slot-open">open</span>';
      }
      row.appendChild(playerBox);
      container.appendChild(row);
    });
  }

  function renderRoster() {
    var roster = getRosterForTeam(YOU_TEAM);
    slotBlock(document.getElementById("rosterStarters"), roster.slotFilled);

    var benchEl = document.getElementById("rosterBench");
    benchEl.innerHTML = "";
    for (var i = 0; i < BENCH_SIZE; i++) {
      var entry = roster.bench[i];
      var row = document.createElement("div");
      row.className = "slot-row";
      var label = document.createElement("span");
      label.className = "slot-label";
      label.textContent = "BN" + (i + 1);
      row.appendChild(label);
      var playerBox = document.createElement("div");
      playerBox.className = "slot-player";
      if (entry) {
        playerBox.innerHTML = '<div class="name">' + esc(entry.player.name) + '</div><div class="meta">' + entry.player.pos + ' · ' + entry.player.team + '</div>';
      } else {
        playerBox.innerHTML = '<span class="slot-open">open</span>';
      }
      row.appendChild(playerBox);
      benchEl.appendChild(row);
    }
  }

  function renderBoard() {
    var overall = currentOverall();
    var table = document.getElementById("boardTable");
    table.innerHTML = "";
    var thead = document.createElement("thead");
    var htr = document.createElement("tr");
    htr.appendChild(document.createElement("th"));
    for (var t = 1; t <= NUM_TEAMS; t++) {
      var th = document.createElement("th");
      if (t === YOU_TEAM) th.className = "you-col";
      var input = document.createElement("input");
      input.className = "team-name-input";
      input.value = state.teamNames[t - 1];
      input.setAttribute("aria-label", "Team " + t + " name");
      input.dataset.teamIdx = t - 1;
      input.addEventListener("blur", function () {
        var idx = parseInt(this.dataset.teamIdx, 10);
        var val = this.value.trim() || ("Team " + (idx + 1));
        state.teamNames[idx] = val;
        saveState();
        render();
        pushTeamName(idx + 1, val);
      });
      th.appendChild(input);
      htr.appendChild(th);
    }
    thead.appendChild(htr);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    for (var r = 1; r <= ROUNDS; r++) {
      var tr = document.createElement("tr");
      var labelTd = document.createElement("td");
      labelTd.className = "board-round-label";
      labelTd.textContent = "R" + r;
      tr.appendChild(labelTd);
      for (var team = 1; team <= NUM_TEAMS; team++) {
        var posInRound = (r % 2 === 1) ? team : (NUM_TEAMS - team + 1);
        var ov = (r - 1) * NUM_TEAMS + posInRound;
        var td = document.createElement("td");
        var cellBtn = document.createElement("button");
        cellBtn.type = "button";
        cellBtn.className = "board-cell";
        if (team === YOU_TEAM) cellBtn.classList.add("you-col");
        if (ov === overall) cellBtn.classList.add("current");
        var playerId = state.picks[ov - 1];
        if (playerId !== null) {
          cellBtn.classList.add("filled");
          var pl = PLAYERS_BY_ID[playerId];
          cellBtn.innerHTML = '<span class="bp-name">' + esc(pl ? pl.name : "?") + '</span><span class="bp-meta">#' + ov + ' · ' + (pl ? pl.pos : "") + '</span>';
        } else {
          cellBtn.classList.add("empty");
          cellBtn.innerHTML = '<span class="bp-num">#' + ov + '</span>';
        }
        cellBtn.addEventListener("click", (function (overallPick) {
          return function () { openPickModal(overallPick); };
        })(ov));
        td.appendChild(cellBtn);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
  }

  /* ================= Actions ================= */
  function assignPick(overall, playerId) {
    if (overall < 1 || overall > TOTAL_PICKS) return;
    state.picks[overall - 1] = playerId;
    saveState();
    searchTerm = "";
    document.getElementById("searchBox").value = "";
    render();
    pushPick(overall, playerId);
  }

  function clearPick(overall) {
    state.picks[overall - 1] = null;
    saveState();
    render();
    pushClearPick(overall);
  }

  function undoLast() {
    var lastIdx = -1;
    for (var i = 0; i < TOTAL_PICKS; i++) {
      if (state.picks[i] !== null) lastIdx = i;
    }
    if (lastIdx >= 0) {
      state.picks[lastIdx] = null;
      saveState();
      render();
      pushClearPick(lastIdx + 1);
    }
  }

  function resetDraft() {
    if (!window.confirm("Reset the whole draft board? This clears every pick.")) return;
    state.picks = new Array(TOTAL_PICKS).fill(null);
    saveState();
    render();
    pushResetPicks();
  }

  /* ================= Modal for board-cell fill/clear ================= */
  function openPickModal(overall) {
    var root = document.getElementById("modalRoot");
    var info = pickInfo(overall);
    var currentId = state.picks[overall - 1];
    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) close(); });

    var modal = document.createElement("div");
    modal.className = "modal";

    var head = document.createElement("div");
    head.className = "modal-head";
    head.innerHTML = '<span class="modal-title">Pick #' + overall + ' · Round ' + info.round + '</span>';
    var closeBtn = document.createElement("button");
    closeBtn.className = "btn small ghost";
    closeBtn.textContent = "Close";
    closeBtn.addEventListener("click", close);
    head.appendChild(closeBtn);
    modal.appendChild(head);

    var sub = document.createElement("div");
    sub.className = "eyebrow";
    sub.style.marginBottom = "10px";
    sub.textContent = ordinalTeamLabel(info.team) + (info.team === YOU_TEAM ? " (you)" : "");
    modal.appendChild(sub);

    if (currentId !== null) {
      var pl = PLAYERS_BY_ID[currentId];
      var cur = document.createElement("div");
      cur.className = "modal-current";
      cur.innerHTML = '<span><strong>' + esc(pl ? pl.name : "?") + '</strong> · ' + (pl ? pl.pos + " · " + pl.team : "") + '</span>';
      var clearBtn = document.createElement("button");
      clearBtn.className = "btn small";
      clearBtn.textContent = "Clear pick";
      clearBtn.addEventListener("click", function () { clearPick(overall); close(); });
      cur.appendChild(clearBtn);
      modal.appendChild(cur);
    }

    var search = document.createElement("input");
    search.type = "text";
    search.placeholder = currentId !== null ? "Replace with a different player…" : "Search a player to fill this pick…";
    search.style.cssText = "width:100%;padding:9px 11px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-family:var(--font-body);font-size:14px;margin-bottom:10px;";
    modal.appendChild(search);

    var list = document.createElement("div");
    list.className = "modal-list";
    modal.appendChild(list);

    function renderList() {
      var term = normalize(search.value);
      var avail = availablePlayers();
      if (term) avail = avail.filter(function (p) { return normalize(p.name).indexOf(term) !== -1; });
      list.innerHTML = "";
      if (!avail.length) {
        list.innerHTML = '<div class="empty-note">No matching available players.</div>';
      }
      avail.slice(0, 60).forEach(function (p) {
        var row = document.createElement("div");
        row.className = "best-row";
        row.style.cursor = "pointer";
        row.innerHTML =
          '<span class="rank-badge">' + p.rank + '</span>' +
          '<span class="pos-badge" style="background:' + posColorVar(p.pos) + '">' + p.pos + '</span>' +
          '<span class="name">' + esc(p.name) + '</span>' +
          '<span class="nfl">' + p.team + '</span>';
        row.addEventListener("click", function () {
          assignPick(overall, p.id);
          close();
        });
        list.appendChild(row);
      });
    }
    search.addEventListener("input", renderList);
    renderList();

    function onKeydown(e) { if (e.key === "Escape") close(); }
    document.addEventListener("keydown", onKeydown);

    function close() {
      document.removeEventListener("keydown", onKeydown);
      if (backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
    }

    backdrop.appendChild(modal);
    root.appendChild(backdrop);
    search.focus();
  }

  /* ================= Team setup modal ================= */
  function openTeamSetupModal(isFirstRun) {
    var root = document.getElementById("modalRoot");
    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.addEventListener("click", function (e) { if (e.target === backdrop) close(); });

    var modal = document.createElement("div");
    modal.className = "modal";

    var head = document.createElement("div");
    head.className = "modal-head";
    head.innerHTML = '<span class="modal-title">Team Setup</span>';
    var closeBtn = document.createElement("button");
    closeBtn.className = "btn small ghost";
    closeBtn.textContent = isFirstRun ? "Skip for now" : "Close";
    closeBtn.addEventListener("click", close);
    head.appendChild(closeBtn);
    modal.appendChild(head);

    // ---- Draft room / sync section ----
    var roomLabel = document.createElement("div");
    roomLabel.className = "eyebrow";
    roomLabel.style.marginBottom = "6px";
    roomLabel.textContent = "Draft room (for live sync across devices)";
    modal.appendChild(roomLabel);

    var roomRow = document.createElement("div");
    roomRow.style.cssText = "display:flex;gap:8px;margin-bottom:8px;";
    var roomInput = document.createElement("input");
    roomInput.type = "text";
    roomInput.value = roomCode;
    roomInput.style.cssText = "flex:1;padding:8px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-family:var(--font-mono);font-size:13px;";
    var switchBtn = document.createElement("button");
    switchBtn.className = "btn small";
    switchBtn.textContent = "Join / switch";
    switchBtn.addEventListener("click", function () {
      var val = roomInput.value.trim();
      if (!val || val === roomCode) return;
      if (!window.confirm("Switch to room \"" + val + "\"? This clears the board you're viewing now and loads that room's picks instead (nothing already saved is deleted).")) return;
      switchRoom(val);
      close();
    });
    roomRow.appendChild(roomInput);
    roomRow.appendChild(switchBtn);
    modal.appendChild(roomRow);

    var shareRow = document.createElement("div");
    shareRow.style.cssText = "display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;";
    var statusText = document.createElement("span");
    statusText.className = "eyebrow";
    var statusLabels = { local: "Local only — not synced", connecting: "Connecting…", live: "Live — synced to this room", error: "Sync error — working locally" };
    statusText.textContent = statusLabels[syncStatus] || "Local only — not synced";
    var copyBtn = document.createElement("button");
    copyBtn.className = "btn small ghost";
    copyBtn.textContent = "Copy share link";
    copyBtn.addEventListener("click", function () {
      var link = shareLink();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(function () {
          copyBtn.textContent = "Copied!";
          setTimeout(function () { copyBtn.textContent = "Copy share link"; }, 1500);
        }).catch(function () { window.prompt("Copy this link:", link); });
      } else {
        window.prompt("Copy this link:", link);
      }
    });
    shareRow.appendChild(statusText);
    shareRow.appendChild(copyBtn);
    modal.appendChild(shareRow);

    if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
      var noSync = document.createElement("div");
      noSync.className = "empty-note";
      noSync.style.marginBottom = "6px";
      noSync.textContent = "Live sync isn't configured in this file yet.";
      modal.appendChild(noSync);
    } else {
      var warn = document.createElement("div");
      warn.className = "empty-note";
      warn.style.marginBottom = "6px";
      warn.textContent = "Anyone with the share link above can view and enter picks in this room — there's no login.";
      modal.appendChild(warn);
    }

    var sub = document.createElement("div");
    sub.className = "eyebrow";
    sub.style.cssText = "margin-top:14px;margin-bottom:12px;";
    sub.textContent = "Name each slot in the real draft order — pick 1 is you";
    modal.appendChild(sub);

    var listWrap = document.createElement("div");
    listWrap.style.display = "flex";
    listWrap.style.flexDirection = "column";
    listWrap.style.gap = "8px";

    var inputs = [];
    for (var t = 1; t <= NUM_TEAMS; t++) {
      var row = document.createElement("div");
      row.style.cssText = "display:flex;align-items:center;gap:10px;";
      var label = document.createElement("span");
      label.className = "eyebrow";
      label.style.cssText = "width:78px;flex-shrink:0;";
      label.textContent = "Pick " + t + (t === YOU_TEAM ? " (you)" : "");
      var input = document.createElement("input");
      input.type = "text";
      input.value = state.teamNames[t - 1];
      input.style.cssText = "flex:1;padding:8px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-family:var(--font-body);font-size:14px;";
      if (t === 1) input.dataset.autofocus = "1";
      row.appendChild(label);
      row.appendChild(input);
      listWrap.appendChild(row);
      inputs.push(input);
    }
    modal.appendChild(listWrap);

    var saveBtn = document.createElement("button");
    saveBtn.className = "btn primary";
    saveBtn.style.marginTop = "14px";
    saveBtn.textContent = "Save team names";
    saveBtn.addEventListener("click", function () {
      inputs.forEach(function (inp, idx) {
        var val = inp.value.trim() || (idx === YOU_TEAM - 1 ? "You" : "Team " + (idx + 1));
        state.teamNames[idx] = val;
        pushTeamName(idx + 1, val);
      });
      saveState();
      render();
      close();
    });
    modal.appendChild(saveBtn);

    function onKeydown(e) { if (e.key === "Escape") close(); }
    document.addEventListener("keydown", onKeydown);

    function close() {
      document.removeEventListener("keydown", onKeydown);
      if (backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
    }

    backdrop.appendChild(modal);
    root.appendChild(backdrop);
    inputs[0].focus();
    inputs[0].select();
  }

  /* ================= Wire up static controls ================= */
  document.getElementById("teamSetupBtn").addEventListener("click", function () { openTeamSetupModal(false); });
  document.getElementById("undoBtn").addEventListener("click", undoLast);
  document.getElementById("resetBtn").addEventListener("click", resetDraft);

  var searchBox = document.getElementById("searchBox");
  searchBox.addEventListener("input", function () {
    searchTerm = this.value;
    renderPool();
  });
  searchBox.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      var overall = currentOverall();
      if (overall === null) return;
      var pool = filteredPool();
      if (pool.length) assignPick(overall, pool[0].id);
    }
  });

  /* ================= Init ================= */
  var hadSavedState = loadState();
  roomCode = resolveInitialRoomCode();
  try {
    var _url = new URL(window.location.href);
    if (_url.searchParams.get("room") !== roomCode) {
      _url.searchParams.set("room", roomCode);
      window.history.replaceState({}, "", _url);
    }
    window.localStorage.setItem(ROOM_CODE_KEY, roomCode);
  } catch (e) { /* ignore */ }
  render();
  renderSyncBadge();
  if (!hadSavedState && !joinedViaUrl) openTeamSetupModal(true);
  connectSupabase();
})();
</script>
